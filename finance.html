<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Finance — Personal Accounts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1E;--surface:#111827;--surface2:#1C2536;
  --border:#263348;--border2:#334466;
  --text:#F0F4FF;--text2:#A8BBDA;--text3:#607090;
  --accent:#38BDF8;--accent-dim:#0C3A52;
  --emerald:#10B981;--emerald-dim:#062B1C;
  --rose:#F43F5E;--rose-dim:#2B0A14;
  --amber:#F59E0B;--amber-dim:#2B1F04;
  --purple:#A78BFA;--purple-dim:#1E1040;
  --radius:8px;--radius-sm:5px;
  --font:'Inter',sans-serif;--mono:'DM Mono',monospace;
}
:root.light{
  --bg:#EFF3F9;--surface:#FFFFFF;--surface2:#E8EDF5;
  --border:#C8D4E8;--border2:#A8BCE0;
  --text:#0D1526;--text2:#2D4268;--text3:#6B82A8;
  --accent:#0369A1;--accent-dim:#DBEAFE;
  --emerald:#047857;--emerald-dim:#D1FAE5;
  --rose:#BE123C;--rose-dim:#FFE4E6;
  --amber:#B45309;--amber-dim:#FEF3C7;
  --purple:#6D28D9;--purple-dim:#EDE9FE;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);}
#mainApp{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ---- PASSWORD GATE ---- */
#pwGate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;}
.pw-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:44px 40px;width:360px;max-width:95vw;text-align:center;}
.pw-logo{font-size:44px;margin-bottom:12px;}
.pw-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;}
.pw-sub{font-size:13px;color:var(--text3);margin-bottom:24px;}
.pw-input{width:100%;padding:13px;font-size:18px;letter-spacing:8px;text-align:center;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;font-family:var(--mono);margin-bottom:10px;}
.pw-input:focus{border-color:var(--accent);}
.pw-btn{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#000;font-family:var(--font);}
.pw-btn:hover{opacity:.88;}
.pw-err{font-size:12px;color:var(--rose);margin-top:10px;display:none;}

/* ---- HEADER ---- */
.header{height:52px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:50;}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--text3);text-decoration:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);transition:background .12s,color .12s;}
.back-btn:hover{background:var(--surface2);color:var(--text);}
.header-title{font-size:15px;font-weight:700;flex:1;}
.header-status{font-size:11px;color:var(--text3);font-family:var(--mono);}
.theme-btn{border:none;background:var(--surface2);color:var(--text2);padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;border:1px solid var(--border);}
.refresh-btn{border:1px solid var(--border);background:var(--surface2);color:var(--text2);padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;}
.refresh-btn:hover{background:var(--border);color:var(--text);}

/* ---- TABS ---- */
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.tab-btn{padding:11px 18px;border:none;background:none;color:var(--text3);font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font);transition:color .12s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ---- CONTENT ---- */
.content{padding:16px 24px;max-width:1200px;box-sizing:border-box;width:100%;flex:1;overflow-y:auto;min-height:0;}

/* ---- CARDS ---- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:28px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.card-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.card-value{font-size:20px;font-weight:800;font-family:var(--mono);line-height:1.2;}
.card-sub{font-size:11px;color:var(--text3);margin-top:5px;}
.card-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block;margin-top:4px;}

/* ---- SECTION HEADER ---- */
.sec-hdr{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;font-weight:700;margin-bottom:8px;margin-top:16px;display:flex;align-items:center;gap:8px;}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border);}

/* ---- TABLE ---- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{background:var(--surface);color:var(--text3);padding:9px 12px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{border-bottom:1px solid var(--border);padding:8px 12px;color:var(--text2);white-space:nowrap;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:var(--surface2);}
.tbl .mono{font-family:var(--mono);}
.tbl .c-g{color:var(--emerald);font-weight:700;}
.tbl .c-r{color:var(--rose);font-weight:700;}
.tbl .c-b{color:var(--accent);}
.tbl .c-d{color:var(--text3);}

/* ---- SEARCH / FILTER / EXPORT ---- */
.tbl-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.srch{padding:7px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:12px;outline:none;width:180px;font-family:var(--font);}
.srch:focus{border-color:var(--accent);}
.tbl-count{font-size:11px;color:var(--text3);flex:1;}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;}
.filter-bar select{padding:5px 9px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:var(--font);outline:none;cursor:pointer;}
.filter-bar select:focus{border-color:var(--accent);}
.filter-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.exp-btn{padding:6px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);background:var(--surface2);color:var(--text);white-space:nowrap;}
.exp-btn:hover{border-color:var(--accent);color:var(--accent);}
.exp-btn.pdf{border-color:var(--rose);color:var(--rose);}
.exp-btn.pdf:hover{background:var(--rose);color:#fff;}
.exp-btn.xls{border-color:var(--emerald);color:var(--emerald);}
.exp-btn.xls:hover{background:var(--emerald);color:#000;}
.exp-btn.copy{border-color:var(--accent);color:var(--accent);}
.exp-btn.copy:hover{background:var(--accent);color:#000;}
.copy-wrap{position:relative;display:inline-block;}
.copy-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);z-index:99;min-width:140px;box-shadow:0 4px 12px rgba(0,0,0,.35);}
.copy-menu.open{display:block;}
.copy-menu button{display:block;width:100%;padding:8px 14px;background:none;border:none;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;text-align:left;font-family:var(--font);white-space:nowrap;}
.copy-menu button:hover{background:var(--surface2);color:var(--accent);}

/* ---- FORM ---- */
.form-wrap{width:100%;display:flex;flex-direction:column;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
.form-grid .span2{grid-column:1/-1;}
.form-group{margin-bottom:9px;}
.form-label{font-size:11px;color:var(--text3);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;}
.form-input{width:100%;padding:8px 11px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;font-family:var(--font);}
.form-input:focus{border-color:var(--accent);}
input[type="date"]{color-scheme:dark;color:var(--text);}
:root.light input[type="date"]{color-scheme:light;color:var(--text);}
input[type="date"]::-webkit-calendar-picker-indicator{filter:brightness(0) invert(1);opacity:.9;cursor:pointer;width:18px;height:18px;}
:root.light input[type="date"]::-webkit-calendar-picker-indicator{filter:none;opacity:.7;}
.form-select{width:100%;padding:8px 11px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;font-family:var(--font);}
.radio-row{display:flex;gap:8px;}
.radio-opt{flex:1;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);}
.radio-opt input{accent-color:var(--accent);width:15px;height:15px;}
.pkr-display{padding:8px 11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-weight:700;color:var(--emerald);font-family:var(--mono);}
.form-footer{position:sticky;bottom:0;background:var(--bg);padding-top:10px;border-top:1px solid var(--border);margin-top:10px;}
.submit-btn{width:100%;padding:11px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;background:var(--emerald);color:#000;font-family:var(--font);}
.submit-btn:hover{opacity:.88;}
.form-msg{margin-bottom:8px;font-size:14px;font-weight:600;text-align:center;font-family:var(--mono);padding:9px 14px;border-radius:var(--radius-sm);display:none;background:var(--surface2);}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-10px);padding:11px 28px;border-radius:8px;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.35);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.t-ok{background:#16a34a;color:#fff;}
.toast.t-err{background:#dc2626;color:#fff;}
.toast.t-warn{background:#b45309;color:#fff;}
.submit-btn:disabled{opacity:.55;cursor:not-allowed;}

/* ---- DASHBOARD TABLES ---- */
.dt-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;margin-bottom:4px;}
.dt{width:100%;border-collapse:collapse;font-size:13px;}
.dt thead tr{background:var(--surface2);}
.dt th{padding:7px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;}
.dt td{padding:6px 12px;border-top:1px solid var(--border);color:var(--text2);white-space:nowrap;}
.dt tbody tr:hover{background:var(--surface2);}
.dt-num{text-align:right!important;font-family:var(--mono);}
.dt-total td{font-weight:700;background:var(--surface2);color:var(--text);border-top:2px solid var(--border)!important;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}

/* Loading spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="pwGate">
  <div class="pw-box">
    <div class="pw-logo">💰</div>
    <div class="pw-title">Finance</div>
    <div class="pw-sub">Personal Accounts · Enter PIN</div>
    <input type="password" id="pwInput" class="pw-input" placeholder="••••" maxlength="10">
    <button class="pw-btn" onclick="checkPin()">Enter</button>
    <div class="pw-err" id="pwErr">Incorrect PIN. Try again.</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="header">
    <a href="portfolio.html" class="back-btn">← Portfolio</a>
    <span style="font-size:18px">💰</span>
    <span class="header-title">Finance</span>
    <span style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:4px">v4.5</span>
    <span class="header-status" id="loadStatus"><span class="spinner"></span>Loading…</span>
    <button class="refresh-btn" onclick="loadAll()">↺ Refresh</button>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tb-dash"  onclick="showTab('dash')">📊 Dashboard</button>
    <button class="tab-btn" id="tb-all"   onclick="showTab('all')">🏦 All Accounts</button>
    <button class="tab-btn" id="tb-credit" onclick="showTab('credit')">👥 CREDIT</button>
    <button class="tab-btn" id="tb-remit" onclick="showTab('remit')">💸 Remittance</button>
    <button class="tab-btn" id="tb-add"   onclick="showTab('add')">＋ Add Entry</button>
  </div>

  <div class="content" id="content">
    <p style="color:var(--text3)">Loading data…</p>
  </div>
</div>

<script>
const PIN = '4209';
const SID = '1gwv-xCDuaDSWp5g2nfrLvkT3xygqc7jg1R8Cizpqwkk';
const GIDS = { credit:'13235236', remit:'1705134543', allAcc:'1234926277' };

// ► Paste your deployed Apps Script URL here after deployment:
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyr_tZiUK21yCV3nmoXPzGkfk-w-Zr-Yt1BbgEBQe6reIKarIhyhTZcyubTH3m2o1jgRQ/exec';

let DATA = { credit:null, remit:null, allAcc:null };
let currentTab = 'dash';

// ---- AUTH ----
function checkPin(){
  const v = document.getElementById('pwInput').value;
  if(v === PIN){
    document.getElementById('pwGate').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    if(localStorage.getItem('fin_theme')==='light') document.documentElement.classList.add('light');
    loadAll();
  } else {
    document.getElementById('pwErr').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });
});

// ---- THEME ----
function toggleTheme(){
  const light = document.documentElement.classList.toggle('light');
  localStorage.setItem('fin_theme', light?'light':'dark');
  document.getElementById('themeBtn').textContent = light?'🌙':'☀️';
}

// ---- CSV LOADING ----
async function loadCSV(gid){
  const url=`https://docs.google.com/spreadsheets/d/${SID}/export?format=csv&gid=${gid}&_=${Date.now()}`;
  const r=await fetch(url);
  return parseCSV(await r.text());
}

function parseCSV(text){
  const lines=text.split('\n');
  if(!lines.length) return {headers:[],rows:[]};
  const headers=parseRow(lines[0]);
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const v=parseRow(lines[i]);const o={};
    headers.forEach((h,j)=>o[h]=(v[j]||'').trim());
    rows.push(o);
  }
  return {headers,rows};
}

function parseRow(line){
  const r=[];let c='';let q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(q&&line[i+1]==='"'){c+='"';i++;}else q=!q;}
    else if(ch===','&&!q){r.push(c.trim());c='';}
    else c+=ch;
  }
  r.push(c.trim());return r;
}

function n(v){ return parseFloat((v||'').toString().replace(/,/g,''))||0; }
function fmt(v,dec=0){ return Math.abs(v).toLocaleString('en-PK',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }

async function loadAll(){
  setStatus('<span class="spinner"></span>Loading…');
  try{
    const [credit,remit,allAcc]=await Promise.all([
      loadCSV(GIDS.credit),loadCSV(GIDS.remit),loadCSV(GIDS.allAcc)
    ]);
    DATA={credit,remit,allAcc};
    setStatus(`✓ ${allAcc.rows.length} + ${credit.rows.length} + ${remit.rows.length} records`);
    renderTab(currentTab);
  } catch(e){
    setStatus('⚠ Error loading data');
    document.getElementById('content').innerHTML='<p style="color:var(--rose)">Failed to load data. Make sure the Google Sheet is shared publicly (View access).</p>';
  }
}

function setStatus(html){ document.getElementById('loadStatus').innerHTML=html; }

// ---- TABS ----
function showTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tb-'+tab).classList.add('active');
  renderTab(tab);
}

function renderTab(tab){
  if(!DATA.allAcc && tab!=='add'){
    document.getElementById('content').innerHTML='<p style="color:var(--text3)">Loading data…</p>';return;
  }
  if(tab==='dash') renderDash();
  else if(tab==='all') renderTable('allAcc');
  else if(tab==='credit') renderTable('credit');
  else if(tab==='remit') renderTable('remit');
  else if(tab==='add') renderForm();
}

// ==============================
// DASHBOARD
// ==============================
let _remitYear='',_remitMonth='All';

function renderDash(){
  function getYear(d){
    const p=(d||'').split('/');
    if(p.length===3){const y=parseInt(p[2],10);return isNaN(y)?'?':String(y<100?2000+y:y);}
    const m=(d||'').match(/\d{4}/);return m?m[0]:'?';
  }
  const MO={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,june:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
  const mNum=m=>MO[m.toLowerCase().slice(0,4)]||MO[m.toLowerCase().slice(0,3)]||0;

  // ── A: Bank Balances
  const bankMap={};
  DATA.allAcc.rows.forEach(r=>{
    const b=r['Bank']||'Other';
    if(!bankMap[b]) bankMap[b]={in:0,out:0};
    bankMap[b].in+=n(r['Debit']); bankMap[b].out+=n(r['Credit']);
  });
  let bankNet=0;
  const bankEntries=Object.entries(bankMap).sort((a,b)=>(b[1].in-b[1].out)-(a[1].in-a[1].out));
  bankEntries.forEach(([,v])=>{ bankNet+=v.in-v.out; });

  // ── B: Credit Balances
  const personMap={};
  DATA.credit.rows.forEach(r=>{
    const nm=(r['Name']||'Unknown').trim().toUpperCase();
    if(!personMap[nm]) personMap[nm]={pkr:{debit:0,credit:0},sar:{debit:0,credit:0}};
    const cur=r['Currency']||'PKR';
    if(cur==='PKR'){personMap[nm].pkr.debit+=n(r['Debit']);personMap[nm].pkr.credit+=n(r['Credit']);}
    else{personMap[nm].sar.debit+=n(r['Debit']);personMap[nm].sar.credit+=n(r['Credit']);}
  });
  const creditEntries=Object.entries(personMap)
    .map(([name,v])=>({name,netPKR:v.pkr.credit-v.pkr.debit,netSAR:v.sar.credit-v.sar.debit}))
    .filter(x=>x.netPKR!==0||x.netSAR!==0)
    .sort((a,b)=>Math.abs(b.netPKR)-Math.abs(a.netPKR));
  let totReceivable=0,totPayable=0,totSAR=0;
  creditEntries.forEach(({netPKR,netSAR})=>{
    if(netPKR>0) totReceivable+=netPKR; else if(netPKR<0) totPayable+=Math.abs(netPKR);
    totSAR+=netSAR;
  });
  const netPosition=bankNet+totReceivable-totPayable;

  // ── C: Remittance
  const allYears=[...new Set(DATA.remit.rows.map(r=>getYear(r['Date'])))].filter(y=>y!=='?').sort((a,b)=>b.localeCompare(a));
  if(!_remitYear||!allYears.includes(_remitYear)) _remitYear=allYears[0]||'?';
  const monthMap={};
  DATA.remit.rows.forEach(r=>{
    if(getYear(r['Date'])!==_remitYear) return;
    const m=r['Month']||'?';
    if(!monthMap[m]) monthMap[m]={sar:0,pkr:0};
    monthMap[m].sar+=n(r['Saudi Riyals']); monthMap[m].pkr+=n(r['Pakistani Rupees']);
  });

  // ── 1. KPI strip (full width, 4 cards)
  let html=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
    <div class="card" style="border-left:3px solid var(--accent)">
      <div class="card-label">💰 Total Cash</div>
      <div class="card-value" style="color:var(--accent)">PKR ${fmt(Math.abs(bankNet))}</div>

function yrFromDate(d){
  const p=(d||'').split('/');
  if(p.length===3){const y=parseInt(p[2],10);return isNaN(y)?'?':String(y<100?2000+y:y);}
  const m=(d||'').match(/\d{4}/);return m?m[0]:'?';
}

function toIsoDate(v){
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const _mo={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  const m=v.match(/^(\d{1,2})\/([A-Za-z]{3,4})\/(\d{2,4})$/);
  if(m){ const yr=m[3].length===2?'20'+m[3]:m[3]; const mm=_mo[m[2].toLowerCase().slice(0,3)]||'00'; return `${yr}-${mm}-${String(+m[1]).padStart(2,'0')}`; }
  return '';
}
const _MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(v){
  if(!v||v==='—') return '—';
  // ISO: YYYY-MM-DD
  let m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return String(+m[3]).padStart(2,'0')+' '+_MO[+m[2]-1]+' '+m[1];
  // D/Mon/YY or DD/Mon/YY
  m=v.match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{2,4})$/);
  if(m){ const yr=m[3].length===2?'20'+m[3]:m[3]; return String(+m[1]).padStart(2,'0')+' '+m[2][0].toUpperCase()+m[2].slice(1,3).toLowerCase()+' '+yr; }
  return v;
}
function buildRows(headers,rows){
  return rows.map(r=>'<tr>'+headers.map(h=>{
    const v=r[h]||'';
    let cls='';
    if(h==='Balance'){cls=n(v)>=0?'mono c-g':'mono c-r';}
    else if(h==='Credit'&&v){cls='mono c-r';}
    else if(h==='Debit'&&v){cls='mono c-g';}
    else if(['Saudi Riyals','Pakistani Rupees','Rate'].includes(h)&&v){cls='mono c-b';}
    const display=h==='Date'?fmtDate(v):v||'—';
    return `<td class="${cls}">${display}</td>`;
  }).join('')+'</tr>').join('');
}

function getFilteredRows(key){
  const {rows}=DATA[key];
  let out=[...rows].reverse();
  if(key==='allAcc'){
    const {bank,dir}=FSTATE.allAcc;
    if(bank) out=out.filter(r=>r['Bank']===bank);
    if(dir==='in') out=out.filter(r=>n(r['Debit'])>0);
    if(dir==='out') out=out.filter(r=>n(r['Credit'])>0);
  } else if(key==='credit'){
    const {name,cur}=FSTATE.credit;
    if(name) out=out.filter(r=>(r['Name']||'').trim()===name);
    if(cur) out=out.filter(r=>r['Currency']===cur);
  } else if(key==='remit'){
    const {year,month,to}=FSTATE.remit;
    if(year) out=out.filter(r=>yrFromDate(r['Date'])===year);
    if(month) out=out.filter(r=>r['Month']===month);
    if(to) out=out.filter(r=>r['To']===to);
  }
  const {dateFrom,dateTo}=FSTATE[key];
  if(dateFrom||dateTo) out=out.filter(r=>{
    const d=toIsoDate(r['Date']||'');
    if(!d) return true;
    if(dateFrom&&d<dateFrom) return false;
    if(dateTo&&d>dateTo) return false;
    return true;
  });
  const q=(document.getElementById('srch_'+key)||{}).value?.toLowerCase()||'';
  if(q) out=out.filter(r=>Object.values(r).some(v=>(v||'').toLowerCase().includes(q)));
  return out;
}

function applyFilters(key){
  const filtered=getFilteredRows(key);
  document.getElementById('tbody_'+key).innerHTML=buildRows(DATA[key].headers.filter(h=>h!=='Balance'),filtered.slice(0,500));
  document.getElementById('tblCount_'+key).textContent=`${filtered.length} of ${DATA[key].rows.length} records${filtered.length>500?' (showing 500)':''}`;
}
function filterTbl(key){applyFilters(key);}

function toggleCopyMenu(key){
  const m=document.getElementById('copyMenu_'+key);
  if(!m) return;

  document.querySelectorAll('.copy-menu.open').forEach(el=>el.classList.remove('open'));

}
function showCopyToast(msg){
  let t=document.getElementById('copyToast');
  if(!t){t=document.createElement('div');t.id='copyToast';t.style.cssText='position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:opacity .3s;pointer-events:none';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',2500);
}
async function copyTable(key,mode){
  document.getElementById('copyMenu_'+key)?.classList.remove('open');
  const rows=getFilteredRows(key);
  const headers=DATA[key].headers.filter(h=>h!=='Balance');
  if(mode==='text'){
    const lines=[headers.join('\t')];
    rows.forEach(r=>lines.push(headers.map(h=>{const v=r[h]||'';return h==='Date'?fmtDate(v):v||'';}).join('\t')));
    try{await navigator.clipboard.writeText(lines.join('\n'));showCopyToast('✅ Copied as text!');}
    catch(e){showCopyToast('❌ Copy failed');}
  } else {
    const tbl=document.querySelector('#tbody_'+key)?.closest('table');
    if(!tbl){showCopyToast('❌ Table not found');return;}
    if(!window.html2canvas){
      showCopyToast('⏳ Loading…');
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    }
    try{
      showCopyToast('📸 Capturing…');
      const canvas=await html2canvas(tbl,{scale:2,useCORS:true,backgroundColor:getComputedStyle(document.body).getPropertyValue('--bg')||'#0d1117'});
      canvas.toBlob(async blob=>{
        try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);showCopyToast('✅ Copied as image!');}
        catch(e){showCopyToast('❌ Clipboard error: '+e.message);}
      });
    }catch(e){showCopyToast('❌ '+e.message);}
  }
}

function exportCSV(key){
  const {headers}=DATA[key];
  const rows=getFilteredRows(key);
  const csv=[headers,...rows.map(r=>headers.map(h=>`"${(r[h]||'').replace(/"/g,'""')}"`))]
    .map(row=>row.join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`${TABLE_CFG[key].title}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function exportPDF(key){
  const cfg=TABLE_CFG[key];
  const visHeaders=DATA[key].headers.filter(h=>h!=='Balance');
  const rows=getFilteredRows(key);

  // Dynamic title for allAcc tab
  let pdfTitle=cfg.title;
  if(key==='allAcc'){
    const parts=[];
    if(FSTATE.allAcc.bank) parts.push(FSTATE.allAcc.bank);
    const q=(document.getElementById('srch_allAcc')||{}).value?.trim()||'';
    if(q) parts.push(q);
    if(FSTATE.allAcc.dir==='in') parts.push('Money In');
    else if(FSTATE.allAcc.dir==='out') parts.push('Money Out');
    if(parts.length) pdfTitle=parts.join(' · ');
  }

  // Totals row — always show for columns that have values
  const _n=v=>parseFloat((v||'').toString().replace(/,/g,''))||0;
  const _fmt=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const dir=key==='allAcc'?FSTATE.allAcc.dir:(key==='credit'?FSTATE.credit.dir:'');
  const ttr=`border-top:2px solid #333;padding:6px 10px;font-size:11px;font-weight:700;`;
  const labelCol=visHeaders.find(h=>['Description','Particulars','Name','Narration'].includes(h))||visHeaders[0];
  // When direction filter active: show only that column; otherwise show both Debit+Credit if non-zero
  const totDebit=rows.reduce((s,r)=>s+_n(r['Debit']),0);
  const totCredit=rows.reduce((s,r)=>s+_n(r['Credit']),0);
  const showDebit=dir==='in'||(dir===''&&totDebit>0);
  const showCredit=dir==='out'||(dir===''&&totCredit>0);
  const totalsRow=`<tr>${visHeaders.map(h=>{
    if(h==='Debit'&&showDebit) return `<td style="${ttr}color:#16a34a">${_fmt(totDebit)}</td>`;
    if(h==='Credit'&&showCredit) return `<td style="${ttr}color:#dc2626">${_fmt(totCredit)}</td>`;
    if(h===labelCol) return `<td style="${ttr}">Total</td>`;
    return `<td style="${ttr}"></td>`;
  }).join('')}</tr>`;

  const colColor=h=>h==='Debit'?'#16a34a':h==='Credit'?'#dc2626':'inherit';
  const th=`padding:6px 10px;text-align:left;border-bottom:2px solid #555;font-size:10px;text-transform:uppercase;background:#eee;`;
  const td=`padding:5px 10px;border-bottom:1px solid #ddd;font-size:11px;`;
  const tbl=`<table style="width:100%;border-collapse:collapse">
    <thead><tr>${visHeaders.map(h=>`<th style="${th}">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${visHeaders.map(h=>{
      const v=r[h]||'';
      const clr=colColor(h);
      const style=td+(v&&clr!=='inherit'?`color:${clr};font-weight:700;`:'');
      const display=h==='Date'?fmtDate(v):v||'—';
      return `<td style="${style}">${display}</td>`;
    }).join('')}</tr>`).join('')}${totalsRow}</tbody>
  </table>`;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><title></title>
    <style>body{font-family:Arial,sans-serif;margin:16px;}h3{font-size:14px;margin-bottom:4px;}p{font-size:10px;color:#666;margin-bottom:10px;}@media print{@page{margin:12mm;}-webkit-print-color-adjust:exact;print-color-adjust:exact;}</style>
    <script>window.onafterprint=function(){window.close();}<\/script>
    </head><body><h3>${pdfTitle}</h3><p>${rows.length} records · ${new Date().toLocaleDateString()}</p>${tbl}</body></html>`);
  w.document.close();w.print();
}

// ==============================
// FORM
// ==============================
function renderForm(){
  let html=`<div class="form-wrap">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap">
      <h2 style="font-size:16px;font-weight:700;margin:0;white-space:nowrap">+ Add New Entry</h2>
      <select class="form-select" id="fSheet" onchange="buildFields()" style="max-width:210px">
        <option value="allAcc" selected>All Accounts</option>
        <option value="credit">CREDIT-COMBINED</option>
        <option value="remit">REMITTANCE</option>
      </select>
    </div>
    <div id="fFields"></div>
    <div class="form-footer">
      <div class="form-msg" id="fMsg"></div>
      <button class="submit-btn" onclick="submitEntry()">Submit Entry</button>
    </div>
  </div>`;
  document.getElementById('content').innerHTML=html;
  buildFields();
}

function clearForm(){
  const msg=document.getElementById('fMsg');
  if(msg){msg.style.display='none';msg.innerHTML='';}
  buildFields();
}

/* helpers */
function uniq(rows,key){ return [...new Set(rows.map(r=>r[key]).filter(v=>v&&v.trim()))].sort(); }

function inp(id,label,type,placeholder,extra='',spanClass=''){
  return `<div class="form-group${spanClass?' '+spanClass:''}">
    <label class="form-label">${label}</label>
    <input id="${id}" type="${type}" placeholder="${placeholder}" ${extra} class="form-input">
  </div>`;
}
function combo(id,label,listId,opts,placeholder,extra='',spanClass=''){
  const optHtml=opts.map(o=>`<option value="${o}">`).join('');
  return `<div class="form-group${spanClass?' '+spanClass:''}">
    <label class="form-label">${label}</label>
    <input id="${id}" list="${listId}" placeholder="${placeholder}" ${extra} class="form-input" autocomplete="off">
    <datalist id="${listId}">${optHtml}</datalist>
  </div>`;
}
function sel(id,label,opts,spanClass=''){
  return `<div class="form-group${spanClass?' '+spanClass:''}">
    <label class="form-label">${label}</label>
    <select id="${id}" class="form-select">${opts.map(o=>`<option>${o}</option>`).join('')}</select>
  </div>`;
}
function radioRow(debitLabel,creditLabel,spanClass=''){
  return `<div class="form-group${spanClass?' '+spanClass:''}">
    <label class="form-label">Type</label>
    <div class="radio-row">
      <label class="radio-opt"><input type="radio" name="fType" value="debit" checked> ${debitLabel}</label>
      <label class="radio-opt"><input type="radio" name="fType" value="credit"> ${creditLabel}</label>
    </div>
  </div>`;
}

function buildFields(){
  const sheet=document.getElementById('fSheet').value;
  const today=new Date().toISOString().split('T')[0];
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const curMonth=MONTHS[new Date().getMonth()];
  let html='';

  if(sheet==='credit'){
    const names = DATA.credit ? uniq(DATA.credit.rows,'Name') : [];
    const descs = DATA.credit ? uniq(DATA.credit.rows,'Description') : [];
    html+=`<div class="form-grid">`;
    html+=inp('fDate','Date','date','',`value="${today}"`);
    html+=sel('fCurrency','Currency',['PKR','SAR']);
    html+=combo('fName','Name','dl-names',names,'e.g. USMAN');
    html+=inp('fAmount','Amount','number','0');
    html+=radioRow('Debit (You received)','Credit (You gave)','span2');
    html+=combo('fDesc','Description','dl-descs',descs,'Transaction description','','span2');
    html+=`</div>`;

  } else if(sheet==='remit'){
    const toOpts = DATA.remit ? uniq(DATA.remit.rows,'To') : [];
    const descOpts = DATA.remit ? uniq(DATA.remit.rows,'DESCRIPTION') : [];
    html+=`<div class="form-grid">`;
    html+=inp('fDate','Date','date','',`value="${today}"`);
    html+=sel('fMonth','Month',MONTHS);
    // set current month
    html+=combo('fTo','To','dl-to',toOpts,'e.g. My Account');
    html+=inp('fSAR','Saudi Riyals (SAR)','number','0');
    html+=`<div class="form-group">
      <label class="form-label">Pakistani Rupees (PKR)</label>
      <input id="fPKR" type="number" placeholder="0" class="form-input" oninput="calcRate()">
    </div>`;
    html+=`<div class="form-group">
      <label class="form-label">Exchange Rate (Auto)</label>
      <div class="pkr-display" id="rateDisp" style="font-size:14px">—</div>
    </div>`;
    html+=combo('fDesc','Description','dl-descs',descOpts,'e.g. BY STC - to my HBL Account','','span2');
    html+=`</div>`;
    setTimeout(()=>{
      const el=document.getElementById('fSAR');
      if(el) el.addEventListener('input',calcRate);
      const sel=document.getElementById('fMonth');
      if(sel){ const idx=new Date().getMonth(); sel.selectedIndex=idx; }
    },50);

  } else { // allAcc
    const banks = DATA.allAcc ? uniq(DATA.allAcc.rows,'Bank') : [];
    const types = DATA.allAcc ? uniq(DATA.allAcc.rows,'Type') : [];
    const descs = DATA.allAcc ? uniq(DATA.allAcc.rows,'Description') : [];
    html+=`<div class="form-grid">`;
    html+=inp('fDate','Date','date','',`value="${today}"`);
    html+=combo('fBank','Bank','dl-banks',banks,'e.g. MCB, HBL');
    html+=combo('fDesc','Description','dl-descs',descs,'Transaction description');
    html+=combo('fType2','Type','dl-types',types,'e.g. Transfer, Salary');
    html+=radioRow('Debit (Money In)','Credit (Money Out)','span2');
    html+=inp('fAmount','Amount','number','0');
    html+=inp('fDetails','Details (optional)','text','Additional details');
    html+=`</div>`;
  }

  document.getElementById('fFields').innerHTML=html;
}

function calcRate(){
  const sar=parseFloat(document.getElementById('fSAR').value)||0;
  const pkr=parseFloat(document.getElementById('fPKR').value)||0;
  const disp=document.getElementById('rateDisp');
  if(disp){
    if(sar&&pkr){ const r=pkr/sar; disp.textContent=`${r.toFixed(4)}`; }
    else { disp.textContent='—'; }
  }
}

function gv(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function gr(name){ const el=document.querySelector(`input[name="${name}"]:checked`); return el?el.value:''; }

async function submitEntry(){
  const sheet=gv('fSheet');
  let data={sheet};

  if(sheet==='credit'){
    if(!gv('fName')||!gv('fAmount')){ showMsg('Name and Amount are required.','var(--rose)'); return; }
    const type=gr('fType');
    data={...data,date:gv('fDate'),name:gv('fName'),description:gv('fDesc'),currency:gv('fCurrency'),
      debit:type==='debit'?gv('fAmount'):'',credit:type==='credit'?gv('fAmount'):''};
  } else if(sheet==='remit'){
    if(!gv('fSAR')||!gv('fPKR')){ showMsg('SAR and PKR are required.','var(--rose)'); return; }
    const sar=parseFloat(gv('fSAR'))||0; const pkr=parseFloat(gv('fPKR'))||0;
    const rate=sar?+(pkr/sar).toFixed(4):0;
    data={...data,date:gv('fDate'),month:gv('fMonth'),to:gv('fTo'),sar,rate,pkr,description:gv('fDesc')};
  } else {
    if(!gv('fAmount')){ showMsg('Amount is required.','var(--rose)'); return; }
    const type=gr('fType');
    data={...data,date:gv('fDate'),description:gv('fDesc'),bank:gv('fBank'),type:gv('fType2'),
      debit:type==='debit'?gv('fAmount'):'',credit:type==='credit'?gv('fAmount'):'',details:gv('fDetails')};
  }

  if(!APPS_SCRIPT_URL){
    showMsg('⚠ Apps Script URL not set. Deploy the script first and paste its URL into finance.html.','var(--amber)');
    return;
  }

  showMsg('<span class="spinner"></span> Submitting…','var(--text3)');
  const _btn=document.querySelector('.submit-btn');
  const _orig=_btn?_btn.textContent:'';
  if(_btn){_btn.disabled=true;_btn.textContent='Saving…';}
  try{
    const params=new URLSearchParams();
    Object.entries(data).forEach(([k,v])=>params.append(k,String(v==null?'':v)));
    const url=`${APPS_SCRIPT_URL}?${params.toString()}&_t=${Date.now()}`;
    let result=null;
    try{
      const resp=await fetch(url);
      result=await resp.json();
    }catch(fetchErr){
      await new Promise(resolve=>{
        const img=new Image();img.onload=img.onerror=resolve;
        img.src=url;setTimeout(resolve,6000);
      });
    }
    if(result){
      if(result.success){
        showToast('✅ Saved successfully!','t-ok');
        showMsg('✅ Saved! Click Refresh to update data.','var(--emerald)');
        setTimeout(clearForm,1800);
      } else {
        showToast(`❌ Error: ${result.error||'Script returned failure'}`,'t-err',7000);
        showMsg(`❌ Error: ${result.error||'Script returned failure. Check the sheet.'}`, 'var(--rose)');
      }
    } else {
      showToast('✅ Sent! Click Refresh to verify.','t-ok');
      showMsg('✅ Sent! Click Refresh to verify it saved.','var(--emerald)');
      setTimeout(clearForm,1800);
    }
  }catch(e){
    showToast('❌ Submission failed — check connection.','t-err');
    showMsg('❌ Submission failed. Check console.','var(--rose)');
    console.error(e);
  }finally{
    if(_btn){_btn.disabled=false;_btn.textContent=_orig;}
  }
}

function showToast(msg, type='t-ok', ms=4000){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg; t.className=`toast ${type} show`;
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>{t.className=`toast ${type}`;},ms);
}
function showMsg(html,color){
  const el=document.getElementById('fMsg');
  if(!el)return;
  el.innerHTML=html; el.style.color=color; el.style.display='block';
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
