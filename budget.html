<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var k='psx_user',ADMIN='qasim';
  var u=sessionStorage.getItem(k)||localStorage.getItem(k+'_r')||'';
  if(!u) window.location.replace('portfolio.html');
  else if(u.trim().toLowerCase()!==ADMIN) window.location.replace('portfolio.html');
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal Finance — PSX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1E;--surface:#111827;--surface2:#1C2536;
  --border:#263348;--border2:#334466;
  --text:#F0F4FF;--text2:#A8BBDA;--text3:#607090;
  --accent:#38BDF8;--accent-dim:#0C3A52;
  --emerald:#10B981;--emerald-dim:#062B1C;
  --rose:#F43F5E;--rose-dim:#2B0A14;
  --amber:#F59E0B;--amber-dim:#2B1F04;
  --orange:#FB923C;
  --purple:#A78BFA;--purple-dim:#1E1040;
  --radius:8px;--radius-sm:5px;
  --font:'Inter',sans-serif;--mono:'DM Mono',monospace;
  --sw:220px;--swc:52px;--hh:52px;
}
:root.light{
  --bg:#EFF3F9;--surface:#FFFFFF;--surface2:#E8EDF5;
  --border:#C8D4E8;--border2:#A8BCE0;
  --text:#0D1526;--text2:#2D4268;--text3:#6B82A8;
  --accent:#0369A1;--accent-dim:#DBEAFE;
  --emerald:#047857;--emerald-dim:#D1FAE5;
  --rose:#BE123C;--rose-dim:#FFE4E6;
  --amber:#B45309;--amber-dim:#FEF3C7;
  --orange:#C2410C;
  --purple:#6D28D9;--purple-dim:#EDE9FE;
}
*{box-sizing:border-box;margin:0;padding:0;transition:background-color .15s,border-color .15s,color .12s;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* SIDEBAR */
.sb{width:var(--sw);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:width .22s cubic-bezier(.4,0,.2,1);}
.sb.col{width:var(--swc);}
.sb-logo{padding:0 14px;height:var(--hh);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;flex-shrink:0;}
.sb-logo-txt{opacity:1;transition:opacity .15s;flex:1;min-width:0;}
.sb.col .sb-logo-txt{opacity:0;pointer-events:none;}
.sb-icon{width:28px;height:28px;background:var(--purple);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sb-nav{flex:1;padding:8px 0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;}
.sb-div{height:1px;background:var(--border);margin:6px 8px;}
.grp-btn{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;}
.grp-btn:hover,.grp-btn.active-grp{color:var(--purple);}
.grp-btn:hover{background:var(--surface2);}
.ni{font-size:18px;flex-shrink:0;width:22px;text-align:center;}
.nl{transition:opacity .18s,max-width .22s;overflow:hidden;max-width:180px;}
.chev{margin-left:auto;font-size:9px;opacity:.5;flex-shrink:0;transition:transform .2s;}
.grp-btn.open .chev{transform:rotate(180deg);opacity:1;}
.sb.col .nl,.sb.col .chev{opacity:0;max-width:0;pointer-events:none;}
.sb.col .grp-btn,.sb.col .sub-btn{padding:9px 0;justify-content:center;gap:0;}
.sb.col .grp-sub{display:none;}
.grp-sub{display:flex;flex-direction:column;overflow:hidden;max-height:0;transition:max-height .25s cubic-bezier(.4,0,.2,1);}
.grp-sub.open{max-height:400px;}
.sub-btn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 42px;font-size:12.5px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;border-radius:var(--radius-sm);white-space:nowrap;}
.sub-btn:hover{background:var(--surface2);color:var(--text);}
.sub-btn.active{background:var(--purple-dim);color:var(--purple);font-weight:600;}
.sb-foot{padding:8px 0;border-top:1px solid var(--border);flex-shrink:0;}
.foot-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;border-radius:var(--radius-sm);}
.foot-btn:hover{background:var(--surface2);}
.foot-lbl{transition:opacity .18s,max-width .22s;overflow:hidden;max-width:180px;}
.sb.col .foot-lbl{opacity:0;max-width:0;pointer-events:none;}
.sb.col .foot-btn{padding:9px 0;justify-content:center;gap:0;}
.sb-tab{position:fixed;top:50%;left:calc(var(--sw) - 1px);transform:translateY(-50%);z-index:200;width:18px;height:48px;background:var(--surface);border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:left .22s cubic-bezier(.4,0,.2,1);box-shadow:2px 0 6px rgba(0,0,0,.15);}
.sb-tab:hover{background:var(--surface2);color:var(--text);}
.sb-tab svg{transition:transform .22s;}
:root.sbc .sb-tab{left:calc(var(--swc) - 1px);}
:root.sbc .sb-tab svg{transform:rotate(180deg);}

/* MAIN */
.main{margin-left:var(--sw);flex:1;min-height:100vh;display:flex;flex-direction:column;transition:margin-left .22s cubic-bezier(.4,0,.2,1);}
:root.sbc .main{margin-left:var(--swc);}
.topbar{height:var(--hh);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:14px;font-weight:700;flex:1;}
.tab-bar{display:flex;padding:0 24px;gap:2px;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;flex-shrink:0;position:sticky;top:var(--hh);z-index:40;}
.tab-btn{padding:10px 16px;font-size:12.5px;font-weight:600;border:none;background:none;color:var(--text3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font);letter-spacing:.1px;}
.tab-btn:hover{color:var(--text2);}
.tab-btn.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:700;}
.tab-pane{display:none;padding:16px 18px;flex-direction:column;gap:14px;}
.tab-pane.active{display:flex;}

/* CARDS / KPI */
.kpi-strip{display:flex;gap:10px;flex-wrap:nowrap;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;flex:1;min-width:0;}
.kpi-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:4px;}
.kpi-val{font-size:15px;font-weight:800;font-family:var(--mono);line-height:1.2;}
.kpi-note{font-size:10px;color:var(--text3);margin-top:3px;}
.kpi.sar .kpi-val{color:var(--accent);}
.kpi.pkr .kpi-val{color:var(--emerald);}
.kpi.visa .kpi-val{color:var(--amber);}
.kpi.rose .kpi-val{color:var(--rose);}
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;}
.sum-icon{font-size:26px;flex-shrink:0;}
.sum-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);}
.sum-val{font-size:18px;font-weight:800;font-family:var(--mono);margin-top:3px;}
.sum-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-hd-placeholder{/* merged into TABLE section */}
.card-bd{padding:14px 16px;}
.cc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.cc-item:last-child{border-bottom:none;}
.visa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.vg-item{background:var(--surface2);border-radius:var(--radius-sm);padding:8px 12px;}
.vg-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.vg-val{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--text);margin-top:2px;}
.prog-bar{background:var(--surface2);border-radius:20px;height:12px;overflow:hidden;border:1px solid var(--border);}
.prog-fill{background:linear-gradient(90deg,var(--amber),#FCD34D);height:100%;border-radius:20px;transition:width .8s;}
.gap-badge{display:inline-flex;align-items:center;gap:5px;background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;font-family:var(--mono);margin-top:10px;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.red{background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);}
.badge.green{background:var(--emerald-dim);color:var(--emerald);border:1px solid var(--emerald);}
.badge.amber{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);}
.badge.blue{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);}
.badge.gray{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.badge.purple{background:var(--purple-dim);color:var(--purple);border:1px solid var(--purple);}
.urg-grid{display:flex;flex-direction:column;gap:6px;}
.urg-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);}
.urg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.urg-desc{flex:1;font-size:12.5px;font-weight:500;}
.urg-note{font-size:11px;color:var(--text3);margin-left:8px;}
.urg-amt{font-size:12px;font-family:var(--mono);color:var(--text2);flex-shrink:0;}

/* TABLES */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{background:var(--surface2);color:var(--text2);padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;border-bottom:2px solid var(--border2);white-space:nowrap;}
.tbl th.r{text-align:right;}
.tbl td{border-bottom:1px solid var(--border);padding:7px 10px;color:var(--text2);white-space:nowrap;vertical-align:middle;}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.02);}
:root.light .tbl tbody tr:nth-child(even) td{background:rgba(0,0,0,.025);}
.tbl tbody tr:hover td{background:var(--surface2)!important;}
.tbl .tot-row td{font-weight:700;color:var(--text);border-top:2px solid var(--purple);background:rgba(167,139,250,.07);}
.tbl .muted-row td{opacity:.55;}
.tbl .section-hdr td{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);padding:6px 10px 3px;background:transparent;border-bottom:none;}
.num{font-family:var(--mono);text-align:right;}
/* TABLE CELL HELPERS */
.tbl-name{font-weight:700;color:var(--text);}
.tbl-dim{color:var(--text3);font-size:11px;}
/* specificity fix: tbl td (0,1,1) overrides .tbl-note (0,1,0) for white-space — use .tbl td.tbl-note */
.tbl td.tbl-note{white-space:normal;max-width:180px;line-height:1.4;color:var(--text3);font-size:11px;}
.tbl-note{color:var(--text3);font-size:11px;white-space:normal;max-width:180px;line-height:1.4;}
.cur-tag{display:inline-block;font-size:10px;font-weight:800;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:var(--mono);letter-spacing:.4px;}
.dash{color:var(--text3);font-family:var(--mono);}
/* PRIORITY COLORS */
.pri-HIGH{color:var(--rose);font-weight:700;}
.pri-RETURN{color:var(--rose);}
.pri-NEXT{color:var(--amber);font-weight:600;}
.pri-QUEUE{color:var(--amber);}
.pri-ASSIGNED{color:var(--accent);}
.pri-WAITING{color:var(--text3);}
.pri-WATCH{color:var(--orange);}
.pri-LOAN{color:var(--purple);}
/* CARD HEADERS */
.card-hd{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.025);}
:root.light .card-hd{background:rgba(0,0,0,.02);}
.card-ttl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text);}
/* GOALS */
.goals-grid{display:flex;flex-direction:column;gap:8px;}
.goal-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);gap:8px;}
.goal-name{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;}

/* COMBINED FORM */
.form-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
.form-top{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--border);}
.cat-sel{width:100%;font-size:14px;font-weight:600;padding:12px 14px;background:var(--surface2);border:1px solid var(--purple);border-radius:var(--radius);color:var(--text);cursor:pointer;outline:none;}
.cat-sel:focus{border-color:var(--purple);}
.cat-hint strong{display:block;font-size:13px;color:var(--purple);margin-bottom:6px;}
.cat-hint p{font-size:13px;color:var(--text3);line-height:1.65;}
.fgrp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.fgrp.hidden{display:none;}
.fg-full{grid-column:1/-1;}
.fg-2{grid-column:span 2;}
.fg-1{grid-column:span 1;}
.fgroup{display:flex;flex-direction:column;gap:6px;}
label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
select,input[type=text],input[type=number],textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;color:var(--text);font-family:var(--font);width:100%;outline:none;}
select:focus,input:focus{border-color:var(--purple);}
.form-foot{display:none;align-items:center;gap:12px;padding-top:20px;margin-top:16px;border-top:1px solid var(--border);}
.form-foot.vis{display:flex;}
.btn-save{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);}
.btn-save:hover{opacity:.85;}
.fstatus{font-size:12px;font-weight:600;font-family:var(--mono);}

/* SEARCH */
.srch-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:7px;}
.fpills{display:flex;flex-wrap:wrap;gap:6px;}
.fpill{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--text3);cursor:pointer;font-family:var(--font);}
.fpill:hover{border-color:var(--purple);color:var(--text);}
.fpill.active{background:var(--purple-dim);border-color:var(--purple);color:var(--purple);}
.srch-row{display:flex;gap:10px;align-items:flex-end;}
.srch-in{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 13px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;}
.srch-in:focus{border-color:var(--purple);}
.srch-mini{width:100px;}
.srch-btn{padding:9px 20px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;}
.srch-res{display:flex;flex-direction:column;gap:8px;}
.sr-none{font-size:13px;color:var(--text3);padding:28px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);}
.sr-hit{color:var(--purple);font-weight:700;}

/* LOAD */
.load-state{display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:12px;color:var(--text3);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.no-data{font-size:12px;color:var(--rose);padding:12px;background:var(--rose-dim);border:1px solid var(--rose);border-radius:var(--radius-sm);}

/* ADVISOR PANEL */
.adv-wrap{display:flex;flex-direction:column;gap:16px;}
.adv-hd{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(56,189,248,.08));border:1px solid var(--border2);border-radius:var(--radius);margin-bottom:0;}
.adv-hd-icon{font-size:26px;flex-shrink:0;}
.adv-hd-text strong{font-size:14px;font-weight:800;color:var(--text);display:block;}
.adv-hd-text span{font-size:11.5px;color:var(--text3);}
.adv-score-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;}
.adv-score-circle{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid;flex-shrink:0;}
.adv-score-num{font-size:22px;font-weight:900;font-family:var(--mono);line-height:1;}
.adv-score-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
.adv-score-bars{display:flex;flex-direction:column;gap:6px;}
.adv-bar-row{display:flex;align-items:center;gap:8px;}
.adv-bar-label{font-size:11px;color:var(--text3);width:160px;flex-shrink:0;}
.adv-bar-track{flex:1;height:6px;background:var(--surface2);border-radius:20px;overflow:hidden;}
.adv-bar-fill{height:100%;border-radius:20px;transition:width .8s;}
.adv-bar-pts{font-size:11px;font-family:var(--mono);color:var(--text3);width:40px;text-align:right;flex-shrink:0;}
.adv-actions{display:flex;flex-direction:column;gap:8px;}
.adv-action{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);position:relative;overflow:hidden;}
.adv-action::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.adv-action.c-rose::before{background:var(--rose);}
.adv-action.c-amber::before{background:var(--amber);}
.adv-action.c-accent::before{background:var(--accent);}
.adv-action.c-emerald::before{background:var(--emerald);}
.adv-action.c-purple::before{background:var(--purple);}
.adv-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;}
.adv-body{flex:1;min-width:0;}
.adv-title{font-size:13px;font-weight:700;color:var(--text);}
.adv-detail{font-size:12px;color:var(--text3);margin-top:3px;line-height:1.5;}
.adv-tag{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:20px;flex-shrink:0;align-self:flex-start;}
.adv-insights{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.adv-insight{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.adv-ins-icon{font-size:18px;margin-bottom:6px;}
.adv-ins-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);}
.adv-ins-val{font-size:12.5px;font-weight:600;color:var(--text2);margin-top:4px;line-height:1.4;}
.adv-warn{display:flex;flex-direction:column;gap:6px;}
.adv-warn-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--rose-dim);border:1px solid var(--rose);font-size:12.5px;color:var(--rose);}
.adv-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

<main class="main">

<script>
/* ══════════════════════════════════════
   CONFIG
══════════════════════════════════════ */
const SID = '1XTDO4sR5lFCUae8lHfsx96P8hLoXA7j2yeZMOiopuT8';
const GS  = 'https://script.google.com/macros/s/AKfycbxKq8r0kG-0wX6EOIWXMWoYQznLrzTb6fOPEM5U6R3ujdNTtSSvAPBxVq_JMwptjdZelA/exec';
const LOG_TAB = 'Budget_Log';

// Budget_Log column indices
const C={date:0,cat:1,type:2,who:3,month:4,cur:5,in:6,out:7,bal:8,pri:9,cert:-1,status:10,notes:11,due:-1};

let _rows=[]; // all Budget_Log rows
let _SF={section:'',priority:'',certainty:''};

/* ── UI HELPERS ── */
function togTheme(){const l=document.documentElement.classList.toggle('light');localStorage.setItem('psx_theme',l?'light':'dark');document.getElementById('thIcon').textContent=l?'🌙':'☀️';document.getElementById('thLbl').textContent=l?' Dark Mode':' Light Mode';}
(function(){if(localStorage.getItem('psx_theme')==='light'){document.documentElement.classList.add('light');document.getElementById('thIcon').textContent='🌙';document.getElementById('thLbl').textContent=' Dark Mode';}})();
function hoverSb(enter){const sb=document.getElementById('sb');if(enter){sb.classList.remove('col');document.documentElement.classList.remove('sbc');}else{sb.classList.add('col');document.documentElement.classList.add('sbc');}}
(function(){document.getElementById('sb').classList.add('col');document.documentElement.classList.add('sbc');})();
function togGrp(btn,id){btn.classList.toggle('open');document.getElementById(id).classList.toggle('open');}
function goTab(name){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn,.sub-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('active');
  document.querySelectorAll('[data-tab="'+name+'"]').forEach(b=>b.classList.add('active'));
}

/* ── CSV ── */
function parseCSV(txt){
  const rows=[];
  for(const line of txt.split('\n')){
    if(!line.trim()) continue;
    const row=[];let f='';let q=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(q&&line[i+1]==='"'){f+='"';i++;}else q=!q;}
      else if(ch===','&&!q){row.push(f.trim());f='';}
      else f+=ch;
    }
    row.push(f.trim());rows.push(row);
  }
  return rows;
}

/* ── FORMATTERS ── */
const nv=v=>parseFloat(v)||0;
const pkr=v=>'₨'+Math.round(nv(v)).toLocaleString('en-PK');
const sar=v=>'SAR '+nv(v).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=(v,cur)=>cur==='PKR'?pkr(v):sar(v);
const num=v=>{const n=parseFloat(v);return isNaN(n)||n===0?'':n.toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:2});};

function bdg(p){
  if(!p)return'';
  const m={HIGH:'red',RETURN:'red',NEXT:'amber',QUEUE:'amber',ASSIGNED:'blue',WAITING:'gray',WATCH:'purple',LOAN:'purple',DONE:'green','PAID 31-Jul':'green','Aug salary':'amber','PAID':'green','GAP 903,622':'rose'};
  return`<span class="badge ${m[p]||'gray'}">${p}</span>`;
}
function priCls(p){return({'HIGH':'pri-HIGH','RETURN':'pri-RETURN','NEXT':'pri-NEXT','QUEUE':'pri-QUEUE','ASSIGNED':'pri-ASSIGNED','WAITING':'pri-WAITING','WATCH':'pri-WATCH','LOAN':'pri-LOAN'})[p]||'';}

// Helper: filter rows by Category column
const bycat=cat=>_rows.filter(r=>r[C.cat]===cat);

/* ══════════════════════════════════════
   RENDER TABS
══════════════════════════════════════ */
function renderOverview(){
  const debts = bycat('Debt');
  const recv  = bycat('Receivable');

  // Summary totals — split by currency
  const totDebtSAR=debts.filter(r=>r[C.cur]==='SAR').reduce((s,r)=>s+nv(r[C.out]),0);
  const totDebtPKR=debts.filter(r=>r[C.cur]==='PKR').reduce((s,r)=>s+nv(r[C.out]),0);
  const confRecv=recv.filter(r=>r[C.cert]!=='Uncertain');
  const confRecvSAR=confRecv.filter(r=>r[C.cur]==='SAR').reduce((s,r)=>s+nv(r[C.in]),0);
  const confRecvPKR=confRecv.filter(r=>r[C.cur]==='PKR').reduce((s,r)=>s+nv(r[C.in]),0);
  const recvLeadPKR=confRecvPKR>=confRecvSAR*74;
  const recvMain=recvLeadPKR?pkr(confRecvPKR):sar(confRecvSAR);
  const recvSub=recvLeadPKR?(confRecvSAR?sar(confRecvSAR)+' SAR':confRecv.length+' items'):(confRecvPKR?pkr(confRecvPKR)+' PKR':'');

  document.getElementById('tabOverview').innerHTML=`<div id="adv-panel"></div>`;
  renderAdvisor();
}

function renderAdvisor(){
  const el=document.getElementById('adv-panel');
  if(!el||!_rows.length) return;

  const debts  = bycat('Debt');
  const recv   = bycat('Receivable');
  const bal    = bycat('Balance');
  const cards  = bycat('Card');
  const visa   = bycat('Visa Fund');
  const income = bycat('Income');

  /* ── balances KPI ── */
  const sarBal = bal.filter(r=>r[C.cur]==='SAR').reduce((s,r)=>s+nv(r[C.in]),0);
  const pkrBal = bal.filter(r=>r[C.cur]==='PKR').reduce((s,r)=>s+nv(r[C.in]),0);
  const ccKPIs=cards.map(r=>{
    const cl=r[C.status]==='CLEARED';
    return`<div class="kpi ${cl?'pkr':'rose'}">
      <div class="kpi-lbl" style="font-family:var(--mono)">${r[C.who]}</div>
      <div class="kpi-val">${cl?'—':sar(nv(r[C.out]))}</div>
      <div class="kpi-note"><span class="badge ${cl?'green':'red'}" style="font-size:9px;padding:1px 6px">${r[C.status]}</span></div>
    </div>`;
  }).join('');
  const balHTML=`<div class="kpi-strip" style="flex-wrap:wrap">${bal.map(r=>{
    const amt=nv(r[C.in]),cur=r[C.cur];
    const cls=r[C.who].includes('MCB')?'visa':cur==='SAR'?'sar':'pkr';
    return`<div class="kpi ${cls}"><div class="kpi-lbl">${r[C.who]}</div><div class="kpi-val">${fmt(amt,cur)}</div><div class="kpi-note">${cur}</div></div>`;
  }).join('')}${ccKPIs}</div>`;

  /* ── visa fund ── */
  const tgtRow  = visa.find(r=>(r[C.type]||'').toLowerCase().includes('target'));
  const vTarget = nv(tgtRow?tgtRow[C.in]:3500000);
  const mcbV    = nv((visa.find(r=>r[C.who]==='MCB')||[])[C.in]||0);
  const abdV    = nv((visa.find(r=>r[C.who]==='Abdullah (Meezan)')||[])[C.in]||0);
  const vCombined = mcbV+abdV;
  const vGap    = Math.max(0,vTarget-vCombined);
  const vPct    = Math.min(100,(vCombined/vTarget)*100);

  /* ── active debts only (exclude DONE / PAID) ── */
  const activeDebts = debts.filter(r=>r[C.pri]!=='DONE'&&r[C.status]!=='PAID'&&r[C.status]!=='CLEARED');
  const totDebtSAR = activeDebts.filter(r=>r[C.cur]==='SAR').reduce((s,r)=>s+nv(r[C.out]),0);
  const totDebtPKR = activeDebts.filter(r=>r[C.cur]==='PKR').reduce((s,r)=>s+nv(r[C.out]),0);
  const highD  = activeDebts.filter(r=>r[C.pri]==='HIGH');
  const retD   = activeDebts.filter(r=>r[C.pri]==='RETURN');
  const nextD  = activeDebts.filter(r=>r[C.pri]==='NEXT');
  const queueD = activeDebts.filter(r=>r[C.pri]==='QUEUE');

  /* ── receivables ── */
  const confRecv = recv.filter(r=>r[C.cert]==='Confirmed');
  const expRecv  = recv.filter(r=>r[C.cert]==='Expected');
  const uncRecv  = recv.filter(r=>r[C.cert]==='Uncertain');
  const confPKR  = confRecv.filter(r=>r[C.cur]==='PKR').reduce((s,r)=>s+nv(r[C.in]),0);
  const confSAR  = confRecv.filter(r=>r[C.cur]==='SAR').reduce((s,r)=>s+nv(r[C.in]),0);
  const expPKR   = expRecv.filter(r=>r[C.cur]==='PKR').reduce((s,r)=>s+nv(r[C.in]),0);

  /* ── income ── */
  const salRows = income.filter(r=>(r[C.type]||'').toLowerCase()==='salary');
  const avgSal  = salRows.length ? salRows.reduce((s,r)=>s+nv(r[C.in]),0)/salRows.length : 3900;

  /* ── derived metrics ── */
  const PKR_RATE = 74;
  const monthlyIncomePKR = avgSal * PKR_RATE;
  const totDebtSARinPKR  = totDebtSAR * PKR_RATE;
  const totDebtAllPKR    = totDebtPKR + totDebtSARinPKR;
  const debtToIncome     = monthlyIncomePKR > 0 ? totDebtAllPKR / monthlyIncomePKR : 0;
  const totalLiquidPKR   = sarBal * PKR_RATE + pkrBal;
  const bufferMonths     = monthlyIncomePKR > 0 ? totalLiquidPKR / monthlyIncomePKR : 0;
  const savingsRate      = 0.40;
  const monthlySavingsPKR = monthlyIncomePKR * savingsRate;
  const mthsToDebtFree   = monthlySavingsPKR > 0 ? Math.ceil(totDebtAllPKR / monthlySavingsPKR) : '?';
  const mthsToFill       = monthlySavingsPKR > 0 && vGap > 0 ? Math.ceil(vGap / monthlySavingsPKR) : (vGap===0?0:'?');
  const urgentTotalPKR   = [...highD,...retD].reduce((s,r)=>s+(r[C.cur]==='PKR'?nv(r[C.out]):nv(r[C.out])*PKR_RATE),0);

  /* ── health score (0–100) ── */
  // Visa Fund 0–30: % of target
  const VISA_MAX=30;
  const visaScore = Math.round((vPct/100)*VISA_MAX);
  // Debt burden 0–25: debt-to-income ratio (0×=25pts, 6×=0pts)
  const DEBT_MAX=25;
  const debtScore = Math.max(0, Math.round(DEBT_MAX * Math.max(0,1 - debtToIncome/6)));
  // Receivables coverage 0–20: confirmed recv as % of total debt
  const RECV_MAX=20;
  const recvCoverage = totDebtAllPKR>0 ? Math.min(1,(confPKR+confSAR*PKR_RATE)/totDebtAllPKR) : 1;
  const recvScore = Math.round(recvCoverage * RECV_MAX);
  // Liquidity buffer 0–25: 3+ months = full score
  const BUFF_MAX=25;
  const buffScore = Math.min(BUFF_MAX, Math.round((bufferMonths/3)*BUFF_MAX));
  const score     = visaScore+debtScore+recvScore+buffScore;
  const scoreClr  = score>=70?'var(--emerald)':score>=45?'var(--amber)':'var(--rose)';
  const scoreLbl  = score>=70?'Good':score>=45?'Caution':'Critical';

  const bars=[
    {label:'Visa Fund progress',          pts:visaScore, max:VISA_MAX, clr:'var(--amber)'},
    {label:'Debt-to-income burden',       pts:debtScore, max:DEBT_MAX, clr:'var(--rose)'},
    {label:'Receivables vs debt coverage',pts:recvScore, max:RECV_MAX, clr:'var(--emerald)'},
    {label:'Liquidity buffer (months)',   pts:buffScore, max:BUFF_MAX, clr:'var(--accent)'},
  ];
  const scoreHTML=`
  <div class="adv-score-row">
    <div class="adv-score-circle" style="border-color:${scoreClr};color:${scoreClr}">
      <div class="adv-score-num">${score}</div>
      <div class="adv-score-lbl" style="color:${scoreClr}">${scoreLbl}</div>
    </div>
    <div class="adv-score-bars">
      ${bars.map(b=>`<div class="adv-bar-row">
        <div class="adv-bar-label">${b.label}</div>
        <div class="adv-bar-track"><div class="adv-bar-fill" style="width:${Math.round((b.pts/b.max)*100)}%;background:${b.clr}"></div></div>
        <div class="adv-bar-pts">${b.pts}/${b.max}</div>
      </div>`).join('')}
    </div>
  </div>`;

  /* ── action queue ── */
  const actions=[];
  const act=(cls,tag,tagBg,tagClr,title,detail)=>actions.push({cls,tag,tagBg,tagClr,title,detail});

  for(const r of highD)
    act('c-rose','URGENT','var(--rose-dim)','var(--rose)',
        `Clear ${r[C.who]}`,
        `${fmt(r[C.out],r[C.cur])} outstanding — ${r[C.notes]||'Highest priority. Clear from next salary before any other outflow. Every day delayed compounds financial stress.'}`);

  for(const r of retD)
    act('c-rose','RETURN','var(--rose-dim)','var(--rose)',
        `Return to ${r[C.who]}`,
        `${fmt(r[C.out],r[C.cur])} — ${r[C.notes]||'Honour this commitment the moment receivables land. Protecting trust is non-negotiable.'}`);

  if(vGap>0)
    act('c-amber','CRITICAL','var(--amber-dim)','var(--amber)',
        `Close Visa Fund gap — ${pkr(vGap)} remaining`,
        `${vPct.toFixed(1)}% funded (${pkr(vCombined)} of ${pkr(vTarget)} target). At ${(savingsRate*100).toFixed(0)}% savings rate, est. ${mthsToFill} month${mthsToFill===1?'':'s'} to close. Contribute proportionally: MCB currently ${pkr(mcbV)}, Abdullah Meezan ${pkr(abdV)}.`);

  if(confPKR>0||confSAR>0){
    const confTotalPKR=confPKR+confSAR*PKR_RATE;
    const debtAlloc=urgentTotalPKR>0?Math.min(confTotalPKR*0.6,urgentTotalPKR):0;
    const visaAlloc=Math.max(0,Math.min(confTotalPKR*0.3,vGap));
    const reserveAlloc=Math.max(0,confTotalPKR-debtAlloc-visaAlloc);
    act('c-emerald','ALLOCATE','var(--emerald-dim)','var(--emerald)',
        `Incoming ${pkr(confPKR)}${confSAR?` + ${sar(confSAR)}`:''} — Allocation Plan`,
        `Recommended split → Debt clearance: ${pkr(debtAlloc)} (${urgentTotalPKR>0?'prioritise HIGH & RETURN':'no urgent debts'}) · Visa Fund: ${pkr(visaAlloc)} · SAR reserve: ${pkr(reserveAlloc)}. Sources: ${confRecv.map(r=>r[C.who]).join(', ')}.`);
  }

  for(const r of nextD)
    act('c-amber','NEXT','var(--amber-dim)','var(--amber)',
        `Pay ${r[C.who]}`,
        `${fmt(r[C.out],r[C.cur])} — ${r[C.notes]||'Schedule immediately after HIGH and RETURN items are resolved.'}`);

  for(const r of expRecv)
    act('c-accent','FOLLOW-UP','var(--accent-dim)','var(--accent)',
        `Follow up: ${r[C.who]}`,
        `${fmt(r[C.in],r[C.cur])} expected${r[C.due]?' — due '+r[C.due]:''} — ${r[C.notes]||'Confirm status, set a firm collection date, and follow through.'}`);

  for(const r of queueD)
    act('c-purple','QUEUE','var(--purple-dim)','var(--purple)',
        `${r[C.who]}`,
        `${fmt(r[C.out],r[C.cur])} — ${r[C.notes]||'Address after all higher-priority items are cleared.'}`);

  if(sarBal<avgSal*0.5)
    act('c-rose','CASH RISK','var(--rose-dim)','var(--rose)',
        `SAR buffer low — ${sar(sarBal)}`,
        `Recommended minimum: ${sar(avgSal*0.5)} (½ month salary). Current covers only ${sarBal>0?((sarBal/avgSal)*30).toFixed(0):0} days of income. Avoid non-essential SAR outflows until next salary arrives.`);

  const actHTML=actions.map((a,i)=>`
  <div class="adv-action ${a.cls}">
    <div class="adv-num" style="background:${a.tagBg};color:${a.tagClr}">${i+1}</div>
    <div class="adv-body">
      <div class="adv-title">${a.title}</div>
      <div class="adv-detail">${a.detail}</div>
    </div>
    <div class="adv-tag" style="background:${a.tagBg};color:${a.tagClr}">${a.tag}</div>
  </div>`).join('');

  /* ── insights (6 tiles) ── */
  const netPosPKR = (confPKR+expPKR) - totDebtAllPKR;
  const netClr    = netPosPKR>=0?'var(--emerald)':'var(--rose)';
  const dtiPct    = (debtToIncome*100).toFixed(0);
  const dtiClr    = debtToIncome<2?'var(--emerald)':debtToIncome<4?'var(--amber)':'var(--rose)';
  const bufClr    = bufferMonths>=2?'var(--emerald)':bufferMonths>=1?'var(--amber)':'var(--rose)';
  const insights=[
    {icon:'⚖️', lbl:'Net Position (all in PKR equiv.)',
     val:`<span style="color:${netClr};font-weight:700">${netPosPKR>=0?'+':''}${pkr(netPosPKR)}</span><br><span style="font-size:11px;color:var(--text3)">${pkr(confPKR+expPKR)} receivable vs ${pkr(totDebtAllPKR)} total debt</span>`},
    {icon:'🎯', lbl:'Visa Fund Status',
     val:`<span style="color:var(--amber);font-weight:700">${vPct.toFixed(1)}% funded</span><br><span style="font-size:11px;color:var(--text3)">Gap ${pkr(vGap)} · est. ${mthsToFill} mo at 40% savings</span>`},
    {icon:'📊', lbl:'Debt-to-Income Ratio',

function dueBadge(due){
  if(!due) return '<span class="dash">—</span>';
  const d=new Date(due),now=new Date();
  now.setHours(0,0,0,0);
  const diff=Math.round((d-now)/(1000*60*60*24));
  let cls='gray',label=due;
  if(diff<0)       {cls='red';  label=`⚠ ${due} (overdue)`;}
  else if(diff===0){cls='red';  label='Today';}
  else if(diff<=7) {cls='amber';label=`${due} (${diff}d)`;}
  else if(diff<=30){cls='blue'; label=`${due} (${diff}d)`;}
  return`<span class="badge ${cls}" style="font-size:10px">${label}</span>`;
}

function renderIncome(){
  const income=bycat('Income');
  const months={};
  for(const r of income){
    const m=r[C.month]||'?';
    if(!months[m]) months[m]={sal:0,ext:0,rem:0,remNote:''};
    const t=(r[C.type]||'').toLowerCase();
    if(t==='salary')         months[m].sal +=nv(r[C.in]);
    else if(t==='extra')     months[m].ext +=nv(r[C.in]);
    else if(t==='remittance'){months[m].rem+=nv(r[C.out]);months[m].remNote=r[C.notes]||'';}
  }
  let rows='';let tS=0,tE=0,tR=0;
  const ORDER=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const sorted=Object.keys(months).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  for(const m of sorted){
    const v=months[m];const tot=v.sal+v.ext;tS+=v.sal;tE+=v.ext;tR+=v.rem;
    const dash='<span class="dash">—</span>';
    rows+=`<tr>
      <td class="tbl-name">${m}</td>
      <td class="num">${sar(v.sal)}</td>
      <td class="num">${v.ext?sar(v.ext):dash}</td>
      <td class="num" style="font-weight:700;color:var(--accent)">${sar(tot)}</td>
      <td class="num">${v.rem?sar(v.rem):dash}</td>
      <td class="num" style="color:var(--emerald);font-weight:600">${v.remNote||dash}</td></tr>`;
  }
  rows+=`<tr class="tot-row"><td>TOTAL</td><td class="num">${sar(tS)}</td><td class="num">${sar(tE)}</td><td class="num">${sar(tS+tE)}</td><td class="num">${sar(tR)}</td><td></td></tr>`;
  document.getElementById('tabIncome').innerHTML=`<div class="card">
    <div class="card-hd"><span>💵</span><span class="card-ttl">Income & Remittance History</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Month</th><th class="r">Salary SAR</th><th class="r">Extra SAR</th><th class="r" style="color:var(--accent)">Total In</th><th class="r">Remit SAR</th><th class="r">Remit PKR</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

  document.getElementById('fl-who').innerHTML=whoOpts.length?whoOpts.map(o=>`<option>${o}</option>`).join(''):'<option value="">— type manually —</option>';

async function saveLog(){
  const date  =(document.getElementById('fl-date').value||'').trim();
  const cat   =(document.getElementById('fl-cat').value||'').trim();
  const type  =(document.getElementById('fl-type').value||'').trim();
  const who   =(document.getElementById('fl-who').value||'').trim();
  const month =(document.getElementById('fl-month').value||'').trim();
  const amtIn =(document.getElementById('fl-in').value||'').trim();
  const amtOut=(document.getElementById('fl-out').value||'').trim();
  const cur   = document.getElementById('fl-cur').value;
  const note  =(document.getElementById('fl-note').value||'').trim();
  const st    = document.getElementById('fl-st');

  if(!cat){st.textContent='Please select a category.';st.style.color='var(--rose)';return;}
  if(!amtIn&&!amtOut){st.textContent='Enter Amount In or Amount Out.';st.style.color='var(--rose)';return;}

  st.textContent='⏳ Saving…';st.style.color='var(--amber)';

  const row=[date,cat,type,who,month,cur,amtIn,amtOut,'','','',note];
  try{
    const resp=await fetch(GS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'appendRow',tab:'Budget_Log',row})});
    const result=await resp.json();
    if(result?.error) throw new Error(result.error);
    st.textContent='✅ Row saved to Budget_Log';st.style.color='var(--emerald)';
    ['fl-in','fl-out','fl-note','fl-who','fl-month'].forEach(id=>{
      const el=document.getElementById(id);if(el) el.value='';
    });
    setTimeout(()=>{st.textContent='';},4000);
  }catch(e){
    st.textContent='❌ '+e.message;st.style.color='var(--rose)';
  }
}

    </div></td>
  </tr>`).join('');
  document.getElementById('tabLog').innerHTML=`
  <div class="srch-box" style="margin-bottom:0;border-radius:var(--radius) var(--radius) 0 0">
    <div class="fl">Filter by Category</div>
    <div class="fpills">${pills}</div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">${filtered.length} of ${_rows.length} rows</div>
  </div>
  <div class="card" style="border-radius:0 0 var(--radius) var(--radius);border-top:none">
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Category</th><th>Type</th><th>Account / Person</th>
        <th class="r">Amt In</th><th class="r">Amt Out</th><th>Cur</th>
        <th>Priority</th><th>Notes</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function filterLog(cat){_logCat=cat==='All'?'':cat;renderLog();}

/* ══════════════════════════════════════
   SHEET UPDATE HELPER (for edit/delete)
══════════════════════════════════════ */
const LOG_HEADERS=['Date','Category','Type / Description','Account / Person','Month','Currency','Amount IN','Amount OUT','Balance','Priority','Status','Notes'];

async function updateSheet(statusEl){
  const rows=[LOG_HEADERS,..._rows];
  if(statusEl){statusEl.textContent='⏳ Saving…';statusEl.style.color='var(--amber)';}
  try{
    const resp=await fetch(GS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'replaceSheet',tab:'Budget_Log',rows})});
    const result=await resp.json();
    if(result?.error) throw new Error(result.error);
    if(statusEl){statusEl.textContent='✅ Saved';statusEl.style.color='var(--emerald)';}
  }catch(e){
    if(statusEl){statusEl.textContent='❌ '+e.message;statusEl.style.color='var(--rose)';}
  }
}

async function deleteRow(i){
  const r=_rows[i];
  if(!confirm(`Delete ${r[C.cat]} row — "${r[C.who]||r[C.type]}"?\nThis cannot be undone.`)) return;
  _rows.splice(i,1);
  renderLog();renderOverview();renderDebts();renderRecv();renderIncome();renderAbd();
  await updateSheet(null);
}

/* ══════════════════════════════════════
   EDIT MODAL
══════════════════════════════════════ */
let _editIdx=-1;

function editRow(i){
  _editIdx=i;
  const r=_rows[i];
  const cat=r[C.cat]||'';
  const typeOpts=LOG_TYPES[cat]||[];
  const whoOpts=WHO_OPTIONS[cat]||[];
  const allCats=['Balance','Card','Visa Fund','Debt','Receivable','Income','Abdullah A/C','Expense','Balance Update'];
  const mkOpt=(opts,sel)=>opts.map(o=>`<option${o===sel?' selected':''}>${o}</option>`).join('');
  const mkSelect=(id,opts,sel,extra='')=>`<select id="${id}" ${extra}>${opts.length?mkOpt(opts,sel):`<option>${sel||''}</option>`}</select>`;

  const existing=document.getElementById('edit-modal');
  if(existing) existing.remove();
  const modal=document.createElement('div');
  modal.id='edit-modal';
  modal.className='modal-backdrop';
  modal.innerHTML=`<div class="modal-box">
    <div class="modal-hd">
      <div class="modal-ttl">✏️ Edit Entry — Row ${i+2}</div>
      <button class="modal-close" onclick="closeEditModal()">✕ Close</button>
    </div>
    <div class="modal-grid">
      <div class="fgroup"><label>Date</label><input type="text" id="ed-date" value="${r[C.date]||''}"></div>
      <div class="fgroup"><label>Category</label>${mkSelect('ed-cat',allCats,cat,'onchange="onEditCat()"')}</div>
      <div class="fgroup"><label>Type</label>${mkSelect('ed-type',typeOpts,r[C.type])}</div>
      <div class="fgroup"><label>Account / Person</label>${mkSelect('ed-who',whoOpts,r[C.who])}</div>
      <div class="fgroup"><label>Month</label>${mkSelect('ed-month',MONTHS_LIST,r[C.month])}</div>
      <div class="fgroup"><label>Currency</label><select id="ed-cur"><option${r[C.cur]==='SAR'?' selected':''}>SAR</option><option${r[C.cur]==='PKR'?' selected':''}>PKR</option></select></div>
      <div class="fgroup"><label>Amount In</label><input type="number" id="ed-in" value="${r[C.in]||''}"></div>
      <div class="fgroup"><label>Amount Out</label><input type="number" id="ed-out" value="${r[C.out]||''}"></div>
      <div class="fgroup"><label>Priority</label><select id="ed-pri"><option value="">—</option>${mkOpt(['HIGH','RETURN','NEXT','QUEUE','ASSIGNED','WAITING','WATCH','LOAN'],r[C.pri])}</select></div>
      <div class="fgroup"><label>Status</label><input type="text" id="ed-status" value="${r[C.status]||''}"></div>
    </div>
    <div class="fgroup" style="margin-top:12px"><label>Notes</label><input type="text" id="ed-notes" value="${r[C.notes]||''}"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn-save" onclick="saveEdit()">💾 Save Changes</button>
      <span id="edit-status" class="fstatus"></span>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function onEditCat(){
  const cat=document.getElementById('ed-cat').value;
  const typeOpts=LOG_TYPES[cat]||[];
  const whoOpts=WHO_OPTIONS[cat]||[];
  document.getElementById('ed-type').innerHTML=typeOpts.length?typeOpts.map(o=>`<option>${o}</option>`).join(''):'<option>—</option>';
  document.getElementById('ed-who').innerHTML=whoOpts.length?whoOpts.map(o=>`<option>${o}</option>`).join(''):'<option value="">—</option>';
}

function closeEditModal(){const m=document.getElementById('edit-modal');if(m)m.remove();}

async function saveEdit(){
  if(_editIdx<0) return;
  _rows[_editIdx]=[
    document.getElementById('ed-date').value.trim(),
    document.getElementById('ed-cat').value,
    document.getElementById('ed-type').value,
    document.getElementById('ed-who').value,
    document.getElementById('ed-month').value,
    document.getElementById('ed-cur').value,
    document.getElementById('ed-in').value.trim(),
    document.getElementById('ed-out').value.trim(),
    _rows[_editIdx][8]||'',
    document.getElementById('ed-pri').value,
    document.getElementById('ed-status').value.trim(),
    document.getElementById('ed-notes').value.trim(),
  ];
  const st=document.getElementById('edit-status');
  await updateSheet(st);
  setTimeout(()=>{
    closeEditModal();
    renderLog();renderOverview();renderDebts();renderRecv();renderIncome();renderAbd();
  },800);
}

/* ══════════════════════════════════════
   SMART LIST
══════════════════════════════════════ */
const CAT_LABELS={'Balance':'💰 Balance','Card':'💳 Card','Visa Fund':'🎯 Visa Fund','Debt':'📋 Debt','Receivable':'📥 Receivable','Income':'💵 Income','Abdullah A/C':'🏦 Abdullah A/C','BANK':'🏛️ BANK','REMITTANCE':'💸 REMITTANCE','Record in SAR':'🇸🇦 Record in SAR','Record in Pks':'🇵🇰 Record in Pks','Expenses':'📊 Expenses'};
const _SL={cat:'',priority:'',certainty:'',cur:'',month:''};

function renderSearch(){
  const _mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const months=[...new Set(_rows.map(r=>r[C.month]).filter(Boolean))].sort((a,b)=>{
    const pa=a.split('-'),pb=b.split('-');
    const ya=parseInt(pa[1]||0),yb=parseInt(pb[1]||0);
    const ma=_mo.indexOf(pa[0]),mb=_mo.indexOf(pb[0]);
    return ya!==yb?ya-yb:ma-mb;
  });
  document.getElementById('tabSearch').innerHTML=`
  <div class="card">
    <div class="card-hd"><span style="color:var(--purple)">📊</span><span class="card-ttl">Smart List — Live Filters</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text3)" id="sl-count">${_rows.length} total rows</span></div>
    <div class="card-bd" style="display:flex;flex-direction:column;gap:16px">
      <div>
        <div class="fl">Category</div>
        <div class="fpills">
          <button class="fpill active" onclick="slFilter('cat','',this)">All</button>
          ${Object.entries(CAT_LABELS).map(([k,v])=>`<button class="fpill" onclick="slFilter('cat','${k}',this)">${v}</button>`).join('')}
        </div>
      </div>
      <div id="sl-sub" style="display:none"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div style="flex:2;min-width:180px">
          <div class="fl">Keyword</div>
          <input class="srch-in" id="sl-kw" placeholder="Name, note, amount…" oninput="runSmartList()">
        </div>
        <div>
          <div class="fl">Month</div>
          <select class="srch-in" id="sl-month" onchange="runSmartList()" style="min-width:130px">
            <option value="">All months</option>
            ${months.map(m=>`<option>${m}</option>`).join('')}
          </select>
        </div>
        <div>
          <div class="fl">Currency</div>
          <div class="fpills" id="sl-cur-pills">
            <button class="fpill active" onclick="slFilter('cur','',this)">All</button>
            <button class="fpill" onclick="slFilter('cur','SAR',this)">SAR</button>
            <button class="fpill" onclick="slFilter('cur','PKR',this)">PKR</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="sl-out"></div>`;
  runSmartList();
}

function slFilter(key,val,btn){
  _SL[key]=val;
  btn.closest('.fpills').querySelectorAll('.fpill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(key==='cat'){
    _SL.priority='';_SL.certainty='';
    const sub=document.getElementById('sl-sub');
    if(val==='Debt'){
      sub.style.display='block';
      sub.innerHTML=`<div class="fl">Priority</div><div class="fpills"><button class="fpill active" onclick="slFilter('priority','',this)">All</button>${['HIGH','RETURN','NEXT','QUEUE','ASSIGNED','WAITING','WATCH','LOAN'].map(p=>`<button class="fpill" onclick="slFilter('priority','${p}',this)">${p}</button>`).join('')}</div>`;
    }else if(val==='Receivable'){
      sub.style.display='block';
      sub.innerHTML=`<div class="fl">Certainty</div><div class="fpills"><button class="fpill active" onclick="slFilter('certainty','',this)">All</button>${['Confirmed','Expected','Uncertain'].map(c=>`<button class="fpill" onclick="slFilter('certainty','${c}',this)">${c}</button>`).join('')}</div>`;
    }else sub.style.display='none';
  }
  runSmartList();
}

function runSmartList(){
  const kw=(document.getElementById('sl-kw')?.value||'').trim().toLowerCase();
  const month=document.getElementById('sl-month')?.value||'';
  const{cat,priority,certainty,cur}=_SL;
  let pool=[..._rows];
  if(cat)      pool=pool.filter(r=>r[C.cat]===cat);
  if(priority) pool=pool.filter(r=>r[C.pri]===priority);
  if(certainty)pool=pool.filter(r=>r[C.cert]===certainty);
  if(cur)      pool=pool.filter(r=>r[C.cur]===cur);
  if(month)    pool=pool.filter(r=>r[C.month]===month);
  if(kw)       pool=pool.filter(r=>r.join(' ').toLowerCase().includes(kw));
  const cnt=document.getElementById('sl-count');
  if(cnt) cnt.textContent=`${pool.length} of ${_rows.length} rows`;
  const out=document.getElementById('sl-out');
  if(!out) return;
  if(!pool.length){out.innerHTML='<div class="sr-none">No entries match these filters</div>';return;}
  const rows=pool.map(r=>`<tr>
    <td class="tbl-dim">${r[C.date]}</td>
    <td><span class="badge ${CAT_CLR[r[C.cat]]||'gray'}">${r[C.cat]}</span></td>
    <td class="tbl-dim">${r[C.type]||''}</td>
    <td class="tbl-name">${r[C.who]||''}</td>
    <td class="num" style="color:var(--emerald);font-weight:600">${num(r[C.in])}</td>
    <td class="num" style="color:var(--rose);font-weight:600">${num(r[C.out])}</td>
    <td><span class="cur-tag">${r[C.cur]||''}</span></td>
    <td>${r[C.pri]?`<span class="badge ${PRI_CLR[r[C.pri]]||'gray'}">${r[C.pri]}</span>`:''}</td>
    <td class="tbl-note">${r[C.notes]||''}</td>
  </tr>`).join('');
  out.innerHTML=`<div class="card">
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Category</th><th>Type</th><th>Account / Person</th><th class="r">Amt In</th><th class="r">Amt Out</th><th>Cur</th><th>Priority</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

/* ══════════════════════════════════════
   LOAD — single Budget_Log fetch
══════════════════════════════════════ */
async function loadAll(){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(LOG_TAB)}&_=${Date.now()}`;
    const r=await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=parseCSV(await r.text());
    _rows=rows.slice(1).filter(r=>r.some(c=>c));
  }catch(e){
    document.getElementById('loadState').innerHTML=`<div class="no-data"><strong>⚠ Could not load Budget_Log</strong><br><br>${e.message}<br><br>Make sure the Google Sheet is shared (anyone with link can view) and Budget_Log tab exists.</div>`;
    return;
  }
  if(!_rows.length){
    document.getElementById('loadState').innerHTML=`<div class="no-data">Budget_Log is empty. Run <strong>createBudgetLog()</strong> in Apps Script first.</div>`;
    return;
  }
  renderOverview();renderDebts();renderRecv();renderIncome();renderAbd();
  renderForms();renderSearch();renderLog();
  document.getElementById('loadState').style.display='none';
  document.getElementById('tabBar').style.display='flex';
  document.getElementById('lbadge').textContent='';
  document.getElementById('asof').textContent='Updated: '+new Date().toLocaleDateString('en-PK',{year:'numeric',month:'short',day:'numeric'});
}

loadAll();
</script>
