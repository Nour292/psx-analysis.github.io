<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var AUTH='psx_user';
  var loggedIn=sessionStorage.getItem(AUTH)||localStorage.getItem(AUTH+'_r');
  if(!loggedIn){ window.location.replace('portfolio.html'); }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal Finance — PSX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1E;--surface:#111827;--surface2:#1C2536;
  --border:#263348;--border2:#334466;
  --text:#F0F4FF;--text2:#A8BBDA;--text3:#607090;
  --accent:#38BDF8;--accent-dim:#0C3A52;
  --emerald:#10B981;--emerald-dim:#062B1C;
  --rose:#F43F5E;--rose-dim:#2B0A14;
  --amber:#F59E0B;--amber-dim:#2B1F04;
  --orange:#FB923C;--orange-dim:#2B1304;
  --purple:#A78BFA;--purple-dim:#1E1040;
  --slate:#64748B;
  --radius:8px;--radius-sm:5px;
  --font:'Inter',sans-serif;--mono:'DM Mono',monospace;
  --sidebar-w:220px;--sidebar-w-collapsed:52px;--header-h:52px;
}
:root.light{
  --bg:#EFF3F9;--surface:#FFFFFF;--surface2:#E8EDF5;
  --border:#C8D4E8;--border2:#A8BCE0;
  --text:#0D1526;--text2:#2D4268;--text3:#6B82A8;
  --accent:#0369A1;--accent-dim:#DBEAFE;
  --emerald:#047857;--emerald-dim:#D1FAE5;
  --rose:#BE123C;--rose-dim:#FFE4E6;
  --amber:#B45309;--amber-dim:#FEF3C7;
  --orange:#C2410C;--orange-dim:#FFEDD5;
  --purple:#6D28D9;--purple-dim:#EDE9FE;
  --slate:#475569;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
*,*::before,*::after{transition:background-color .2s,border-color .2s,color .15s;}
.shell{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;flex-shrink:0;transition:width .22s cubic-bezier(.4,0,.2,1);}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-logo{padding:0 14px;height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;}
.sidebar-logo .logo-text-wrap{opacity:1;transition:opacity .15s .05s;flex:1;min-width:0;}
.sidebar.collapsed .logo-text-wrap{opacity:0;pointer-events:none;}
.logo-icon{width:28px;height:28px;background:var(--purple);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.logo-text{font-size:14px;font-weight:700;color:var(--text);}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px;}
.sidebar-nav{flex:1;padding:8px 0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;transition:background .12s,color .12s;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--purple-dim);color:var(--purple);}
.nav-icon{font-size:18px;flex-shrink:0;width:22px;text-align:center;}
.nav-label{transition:opacity .18s,max-width .22s;overflow:hidden;max-width:180px;}
.sidebar.collapsed .nav-label{opacity:0;max-width:0;pointer-events:none;}
.sidebar.collapsed .nav-item{padding:9px 0;justify-content:center;gap:0;}
.nav-divider{height:1px;background:var(--border);margin:6px 8px;}
.nav-grp{display:flex;flex-direction:column;}
.nav-grp-btn{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;transition:background .12s,color .12s;}
.nav-grp-btn:hover{background:var(--surface2);color:var(--text);}
.nav-grp-chevron{margin-left:auto;font-size:9px;opacity:.5;flex-shrink:0;transition:transform .2s;}
.nav-grp-btn.open .nav-grp-chevron{transform:rotate(180deg);opacity:1;}
.sidebar.collapsed .nav-grp-btn{padding:9px 0;justify-content:center;gap:0;}
.sidebar.collapsed .nav-grp-btn .nav-label{opacity:0;max-width:0;pointer-events:none;}
.sidebar.collapsed .nav-grp-chevron{display:none;}
.nav-sub{display:flex;flex-direction:column;overflow:hidden;max-height:0;transition:max-height .22s cubic-bezier(.4,0,.2,1);}
.nav-sub.open{max-height:300px;}
.sidebar.collapsed .nav-sub{display:none;}
.nav-sub-btn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 42px;font-size:12.5px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;border-radius:var(--radius-sm);white-space:nowrap;transition:background .12s,color .12s;}
.nav-sub-btn:hover{background:var(--surface2);color:var(--text);}
.sidebar-footer{padding:8px 0;border-top:1px solid var(--border);}
.footer-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;}
.footer-btn:hover{background:var(--surface2);color:var(--text);}
.footer-label{transition:opacity .18s,max-width .22s;overflow:hidden;max-width:180px;}
.sidebar.collapsed .footer-label{opacity:0;max-width:0;pointer-events:none;}
.sidebar.collapsed .footer-btn{padding:9px 0;justify-content:center;gap:0;}
.sb-toggle-tab{position:fixed;top:50%;left:calc(var(--sidebar-w) - 1px);transform:translateY(-50%);z-index:200;width:18px;height:48px;background:var(--surface);border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:left .22s cubic-bezier(.4,0,.2,1),background .12s;box-shadow:2px 0 6px rgba(0,0,0,.15);}
.sb-toggle-tab:hover{background:var(--surface2);color:var(--text);}
.sb-toggle-tab svg{transition:transform .22s;flex-shrink:0;}
:root.sb-collapsed .sb-toggle-tab{left:calc(var(--sidebar-w-collapsed) - 1px);}
:root.sb-collapsed .sb-toggle-tab svg{transform:rotate(180deg);}

/* ── MAIN ── */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column;transition:margin-left .22s cubic-bezier(.4,0,.2,1);}
:root.sb-collapsed .main{margin-left:var(--sidebar-w-collapsed);}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:14px;font-weight:700;color:var(--text);flex:1;}
.topbar-date{font-size:11px;color:var(--text3);font-family:var(--mono);}

/* ── STICKY TABS ── */
.tab-bar{display:flex;padding:0 24px;gap:2px;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;flex-shrink:0;
  position:sticky;top:var(--header-h);z-index:40;}
.tab-btn{padding:11px 16px;font-size:12.5px;font-weight:600;border:none;background:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font);transition:color .12s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--purple);border-bottom-color:var(--purple);}
.tab-pane{display:none;padding:20px 24px;flex-direction:column;gap:16px;}
.tab-pane.active{display:flex;}

/* ── KPI ── */
.kpi-strip{display:flex;gap:10px;flex-wrap:nowrap;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;flex:1;min-width:0;}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:4px;}
.kpi-val{font-size:16px;font-weight:800;font-family:var(--mono);line-height:1.2;}
.kpi-note{font-size:10px;color:var(--text3);margin-top:3px;}
.kpi.sar .kpi-val{color:var(--accent);}
.kpi.pkr .kpi-val{color:var(--emerald);}
.kpi.visa .kpi-val{color:var(--amber);}
.kpi.danger .kpi-val{color:var(--rose);}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;}
.sum-icon{font-size:26px;flex-shrink:0;}
.sum-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);}
.sum-val{font-size:18px;font-weight:800;font-family:var(--mono);margin-top:3px;}
.sum-sub{font-size:11px;color:var(--text3);margin-top:2px;}

/* ── URGENT ACTIONS ── */
.urgent-grid{display:flex;flex-direction:column;gap:6px;}
.urgent-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);}
.urgent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.urgent-desc{flex:1;font-size:12.5px;font-weight:500;color:var(--text);}
.urgent-amt{font-size:12px;font-family:var(--mono);color:var(--text2);}

/* ── CARDS ── */
.row2{display:grid;grid-template-columns:3fr 2fr;gap:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-head{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.card-head-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);}
.card-body{padding:14px 16px;}
.cc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.cc-item:last-child{border-bottom:none;}
.cc-name{font-size:13px;font-weight:600;color:var(--text);font-family:var(--mono);}
.cc-sub{font-size:11px;color:var(--text3);margin-top:2px;}

/* ── VISA FUND ── */
.visa-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.vs-item{background:var(--surface2);border-radius:var(--radius-sm);padding:8px 12px;}
.vs-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.vs-val{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--text);margin-top:2px;}
.prog-label-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px;}
.prog-bar{background:var(--surface2);border-radius:20px;height:12px;overflow:hidden;border:1px solid var(--border);}
.prog-fill{background:linear-gradient(90deg,var(--amber),#FCD34D);height:100%;border-radius:20px;transition:width .8s;}
.gap-badge{display:inline-flex;align-items:center;gap:5px;background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;font-family:var(--mono);margin-top:10px;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;}
.badge.red{background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);}
.badge.green{background:var(--emerald-dim);color:var(--emerald);border:1px solid var(--emerald);}
.badge.amber{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);}
.badge.blue{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);}
.badge.gray{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.badge.purple{background:var(--purple-dim);color:var(--purple);border:1px solid var(--purple);}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{background:var(--surface2);color:var(--text3);padding:8px 12px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{border-bottom:1px solid var(--border);padding:8px 12px;color:var(--text2);white-space:nowrap;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:var(--surface2);}
.tbl .total-row td{font-weight:700;color:var(--text);border-top:1px solid var(--border2);background:var(--surface2);}
.tbl .muted-row td{color:var(--text3);}
.num{font-family:var(--mono);}
.pri-high{color:var(--rose);font-weight:700;}
.pri-return{color:var(--rose);}
.pri-next{color:var(--amber);font-weight:600;}
.pri-queue{color:var(--amber);}
.pri-assigned{color:var(--accent);}
.pri-waiting{color:var(--text3);}
.pri-watch{color:var(--orange);}
.pri-loan{color:var(--purple);}

/* ── GOALS ── */
.goals-grid{display:flex;flex-direction:column;gap:6px;}
.goal-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:var(--radius-sm);background:var(--surface2);gap:8px;}
.goal-name{font-size:12px;font-weight:600;color:var(--text);flex:1;min-width:0;}
.goal-target{font-size:11px;color:var(--text3);font-family:var(--mono);}

/* ── FORMS ── */
.form-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0;}
.ftab-btn{padding:8px 16px;font-size:12px;font-weight:600;border:none;background:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font);}
.ftab-btn:hover{color:var(--text);}
.ftab-btn.active{color:var(--purple);border-bottom-color:var(--purple);}
.fpane{display:none;}
.fpane.active{display:block;}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:560px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}
label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
input[type=text],input[type=number],select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;color:var(--text);font-family:var(--font);width:100%;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--purple);}
textarea{resize:vertical;min-height:60px;}
.btn-save{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.btn-save:hover{opacity:.85;}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.form-status{font-size:12px;font-weight:600;margin-left:12px;font-family:var(--mono);}
.form-divider{height:1px;background:var(--border);margin:16px 0;}

/* ── SEARCH ── */
.search-box{display:flex;gap:10px;align-items:center;}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--purple);}
.search-btn{padding:10px 18px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.search-results{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.sr-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;}
.sr-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--purple);margin-bottom:4px;}
.sr-cells{display:flex;flex-wrap:wrap;gap:6px;}
.sr-cell{font-size:12px;color:var(--text2);padding:2px 6px;border-radius:3px;}
.sr-cell.hit{background:var(--purple-dim);color:var(--purple);font-weight:600;}
.sr-none{font-size:13px;color:var(--text3);padding:20px;text-align:center;}

/* ── LOAD ── */
.load-state{display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:12px;color:var(--text3);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="shell">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">💰</div>
    <div class="logo-text-wrap">
      <div class="logo-text">PSX Analysis</div>
      <div class="logo-sub">Personal Finance</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-grp">
      <button class="nav-grp-btn" onclick="this.classList.toggle('open');document.getElementById('taSub').classList.toggle('open')">
        <span class="nav-icon">📊</span><span class="nav-label"> Technical Analysis</span><span class="nav-grp-chevron">▼</span>
      </button>
      <div class="nav-sub" id="taSub">
        <button class="nav-sub-btn" onclick="location.href='index.html'">⌂ Dashboard</button>
        <button class="nav-sub-btn" onclick="location.href='index.html'">▶ Weekly Analysis</button>
      </div>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-grp">
      <button class="nav-grp-btn" onclick="this.classList.toggle('open');document.getElementById('portSub').classList.toggle('open')">
        <span class="nav-icon">📈</span><span class="nav-label"> Portfolio</span><span class="nav-grp-chevron">▼</span>
      </button>
      <div class="nav-sub" id="portSub">
        <button class="nav-sub-btn" onclick="location.href='portfolio.html'">📊 Dashboard</button>
      </div>
    </div>
    <div class="nav-divider"></div>
    <button class="nav-item active"><span class="nav-icon">💰</span><span class="nav-label"> Personal Finance</span></button>
  </nav>
  <div class="sidebar-footer">
    <button class="footer-btn" onclick="toggleTheme()" id="themeBtn">
      <span id="themeIcon" style="font-size:15px">☀️</span><span class="footer-label" id="themeLbl"> Light Mode</span>
    </button>
    <button class="footer-btn" onclick="location.reload()">
      <span style="font-size:15px">↺</span><span class="footer-label"> Refresh</span>
    </button>
    <div class="footer-btn" style="cursor:default">
      <span class="footer-label" style="font-size:10px;color:var(--text3)">PSX · Pakistan Stock Exchange</span>
    </div>
  </div>
</aside>

<button class="sb-toggle-tab" onclick="toggleSidebar()">
  <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M7 2L2 8l5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<!-- MAIN -->
<main class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-title">Personal Finance</div>
    <div class="topbar-date" id="asofDate"></div>
    <span id="loadBadge" style="font-size:11px;color:var(--text3)">Loading…</span>
  </div>

  <!-- STICKY TAB BAR -->
  <div class="tab-bar" id="tabBar" style="display:none">
    <button class="tab-btn active" onclick="switchTab('overview',this)">🏦 Overview</button>
    <button class="tab-btn" onclick="switchTab('debts',this)">📋 Debts</button>
    <button class="tab-btn" onclick="switchTab('receivables',this)">📥 Receivables</button>
    <button class="tab-btn" onclick="switchTab('goals',this)">🎯 Goals</button>
    <button class="tab-btn" onclick="switchTab('income',this)">💵 Income</button>
    <button class="tab-btn" onclick="switchTab('abdullah',this)">🏦 Abdullah A/C</button>
    <button class="tab-btn" onclick="switchTab('forms',this)">📝 Forms</button>
    <button class="tab-btn" onclick="switchTab('search',this)">🔍 Search</button>
  </div>

  <!-- LOAD STATE -->
  <div class="load-state" id="loadState">
    <div class="spinner"></div>
    <span>Loading budget data…</span>
  </div>

  <!-- TAB PANES -->
  <div id="tabOverview"    class="tab-pane active"></div>
  <div id="tabDebts"       class="tab-pane"></div>
  <div id="tabReceivables" class="tab-pane"></div>
  <div id="tabGoals"       class="tab-pane"></div>
  <div id="tabIncome"      class="tab-pane"></div>
  <div id="tabAbdullah"    class="tab-pane"></div>
  <div id="tabForms"       class="tab-pane"></div>
  <div id="tabSearch"      class="tab-pane"></div>
</main>

<script>

/* ── CSV PARSER ── */
function parseCSV(text){
  const rows=[];
  for(const line of text.split('\n')){
    if(!line.trim()) continue;
    const row=[];let field='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){field+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){row.push(field.trim());field='';}
      else field+=c;
    }
    row.push(field.trim());
    rows.push(row);
  }
  return rows;
}

/* ── SECTION PARSER ── */
const KNOWN_SECTIONS=[
  'PROFILE','BALANCES','CREDIT CARDS','VISA FUND','DEBTS',
  'RECEIVABLES','INCOME HISTORY (Jan–7 2026)',
  'INCOME HISTORY (Jan–Jul 2026)',
  'ABDULLAH MEEZAN ACCOUNT — VISA STATEMENT',
  'ABDULLAH MEEZAN ACCOUNT — VISA STATEMENT',
  'GOALS & TARGETS'
];
function isSectionHeader(s){ return KNOWN_SECTIONS.some(k=>s===k||s.startsWith('INCOME HISTORY')||s.startsWith('ABDULLAH MEEZAN')); }

function parseSections(rows){
  const sections={};const order=[];
  let cur=null;let gotHeader=false;
  for(const row of rows){
    const first=(row[0]||'').trim();
    if(!first) continue;
    if(isSectionHeader(first)){
      cur=first;sections[cur]={headers:[],data:[]};order.push(cur);gotHeader=false;continue;
    }
    if(cur&&!gotHeader){sections[cur].headers=row;gotHeader=true;continue;}
    if(cur) sections[cur].data.push([...row]);
  }
  return {sections,order};
}

  const isAdd=document.getElementById('fd-mode').value==='add';
  document.getElementById('fd-existing-row').style.display=isAdd?'none':'grid';
  document.getElementById('fd-new-row').style.display=isAdd?'grid':'none';
}
function toggleRecvPerson(){
  const isAdd=document.getElementById('fr-mode').value==='add';
  document.getElementById('fr-existing-row').style.display=isAdd?'none':'grid';
  document.getElementById('fr-new-row').style.display=isAdd?'grid':'none';
}

/* ── REBUILD ROWS FOR SHEET ── */
function buildRows(){
  const rows=[];
  for(const name of _sectionOrder){
    const sec=_sections[name];if(!sec) continue;
    rows.push(['','','','','','','']);
    rows.push([name,'','','','','','']);
    rows.push(sec.headers);
    for(const r of sec.data) rows.push(r.length<7?[...r,...Array(7-r.length).fill('')]:r);
  }
  return rows;
}

/* ── WRITE TO SHEET ── */
async function writeSheet(statusId){
  const el=document.getElementById(statusId);
  el.textContent='⏳ Saving…';el.style.color='var(--amber)';
  try{
    const rows=buildRows();
    const resp=await fetch(GS_WRITE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'replaceSheet',tab:SHEET_TAB,rows})});
    const result=await resp.json();
    if(result&&result.error) throw new Error(result.error);
    el.textContent='✅ Saved!';el.style.color='var(--emerald)';
    setTimeout(()=>{el.textContent='';},3000);
    await load();
  }catch(e){
    el.textContent='❌ '+e.message;el.style.color='var(--rose)';
  }
}

/* ── FORM: SAVE BALANCE ── */
function saveBalance(){
  const acct=document.getElementById('fb-account').value;
  const amount=document.getElementById('fb-amount').value.trim();
  const notes=document.getElementById('fb-notes').value.trim();
  if(!amount){document.getElementById('fb-status').textContent='Enter a balance';return;}
  const data=(_sections['BALANCES']||{data:[]}).data;
  for(const row of data){
    if(row[0]===acct){row[2]=amount;if(notes)row[3]=notes;break;}
  }
  writeSheet('fb-status');
}

/* ── FORM: SAVE DEBT ── */
function saveDebt(){
  const mode=document.getElementById('fd-mode').value;
  const sar=document.getElementById('fd-sar').value.trim();
  const pkr=document.getElementById('fd-pkr').value.trim();
  const priority=document.getElementById('fd-priority').value;
  const notes=document.getElementById('fd-notes').value.trim();
  const data=(_sections['DEBTS']||{data:[]}).data;

  if(mode==='update'){
    const person=document.getElementById('fd-existing').value;
    for(const row of data){
      if(row[1]===person){
        if(sar) row[2]=sar;
        if(pkr) row[3]=pkr;
        row[4]=priority;
        if(notes) row[5]=notes;
        break;
      }
    }
  } else {
    const person=document.getElementById('fd-name').value.trim();
    if(!person){document.getElementById('fd-status').textContent='Enter a name';return;}
    const totalIdx=data.findIndex(r=>r[1]==='TOTAL');
    const no=String(totalIdx>0?totalIdx:data.length+1);
    const newRow=[no,person,sar||'0',pkr||'0',priority,notes,''];
    if(totalIdx>=0) data.splice(totalIdx,0,newRow);
    else data.push(newRow);
    // update TOTAL
    const totRow=data.find(r=>r[1]==='TOTAL');
    if(totRow){
      const tSar=data.filter(r=>r[1]&&r[1]!=='TOTAL').reduce((s,r)=>s+num(r[2]),0);
      const tPkr=data.filter(r=>r[1]&&r[1]!=='TOTAL').reduce((s,r)=>s+num(r[3]),0);
      totRow[2]=tSar.toFixed(2);totRow[3]=String(Math.round(tPkr));
    }
  }
  writeSheet('fd-status');
}

/* ── FORM: SAVE RECEIVABLE ── */
function saveReceivable(){
  const mode=document.getElementById('fr-mode').value;
  const pkr=document.getElementById('fr-pkr').value.trim();
  const sar=document.getElementById('fr-sar').value.trim();
  const certainty=document.getElementById('fr-certainty').value;
  const notes=document.getElementById('fr-notes').value.trim();
  const data=(_sections['RECEIVABLES']||{data:[]}).data;

  if(mode==='update'){
    const from=document.getElementById('fr-existing').value;
    for(const row of data){
      if(row[0]===from){
        if(pkr) row[1]=pkr;
        if(sar) row[2]=sar;
        row[3]=certainty;
        if(notes) row[4]=notes;
        break;
      }
    }
  } else {
    const from=document.getElementById('fr-name').value.trim();
    if(!from){document.getElementById('fr-status').textContent='Enter a name';return;}
    const totalIdx=data.findIndex(r=>(r[0]||'').includes('Total'));
    const newRow=[from,pkr||'0',sar||'',certainty,notes,'',''];
    if(totalIdx>=0) data.splice(totalIdx,0,newRow);
    else data.push(newRow);
    // update total
    const totRow=data.find(r=>(r[0]||'').includes('Total'));
    if(totRow){
      const tPkr=data.filter(r=>r[0]&&!r[0].includes('Total')&&(r[3]==='Confirmed'||r[3]==='Expected')).reduce((s,r)=>s+num(r[1]),0);
      totRow[1]=String(Math.round(tPkr));
    }
  }
  writeSheet('fr-status');
}

/* ── SEARCH ── */
function doSearch(){
  const q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  const out=document.getElementById('searchResults');
  if(!q){out.innerHTML='<div class="sr-none">Type to search across all budget data</div>';return;}
  const results=[];
  for(const name of _sectionOrder){
    const sec=_sections[name];if(!sec) continue;
    for(const row of sec.data){
      const rowText=row.join(' ').toLowerCase();
      if(rowText.includes(q)) results.push({section:name,row});
    }
  }
  if(!results.length){out.innerHTML=`<div class="sr-none">No results for "<b>${q}</b>"</div>`;return;}
  out.innerHTML=results.map(r=>{
    const cells=r.row.filter(c=>c.trim()).map(c=>{
      const hi=c.toLowerCase().includes(q);
      return `<span class="sr-cell${hi?' hit':''}">${c}</span>`;
    }).join('');
    return `<div class="sr-item"><div class="sr-section">${r.section}</div><div class="sr-cells">${cells}</div></div>`;
  }).join('');
}

/* ── LOAD ── */
async function load(){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}&_=${Date.now()}`;
    const resp=await fetch(url);
    if(!resp.ok) throw new Error('Fetch failed '+resp.status);
    const text=await resp.text();
    const rows=parseCSV(text);
    const parsed=parseSections(rows);
    _sections=parsed.sections;
    _sectionOrder=parsed.order;
    render();
    document.getElementById('loadState').style.display='none';
    document.getElementById('tabBar').style.display='flex';
    document.getElementById('loadBadge').textContent='';
    document.getElementById('asofDate').textContent='Updated: '+new Date().toLocaleDateString('en-PK',{year:'numeric',month:'short',day:'numeric'});
  }catch(e){
    document.getElementById('loadState').innerHTML=`<span style="color:var(--rose)">⚠ ${e.message}</span><br><span style="font-size:12px;color:var(--text3)">Run the Apps Script first, then refresh.</span>`;
  }
}

load();
