<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var AUTH='psx_user';
  var loggedIn=sessionStorage.getItem(AUTH)||localStorage.getItem(AUTH+'_r');
  if(!loggedIn){ window.location.replace('portfolio.html'); }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal Finance — PSX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1E;--surface:#111827;--surface2:#1C2536;
  --border:#263348;--border2:#334466;
  --text:#F0F4FF;--text2:#A8BBDA;--text3:#607090;
  --accent:#38BDF8;--accent-dim:#0C3A52;
  --emerald:#10B981;--emerald-dim:#062B1C;
  --rose:#F43F5E;--rose-dim:#2B0A14;
  --amber:#F59E0B;--amber-dim:#2B1F04;
  --orange:#FB923C;--orange-dim:#2B1304;
  --purple:#A78BFA;--purple-dim:#1E1040;
  --radius:8px;--radius-sm:5px;
  --font:'Inter',sans-serif;--mono:'DM Mono',monospace;
  --sidebar-w:220px;--sidebar-w-collapsed:52px;--header-h:52px;
}
:root.light{
  --bg:#EFF3F9;--surface:#FFFFFF;--surface2:#E8EDF5;
  --border:#C8D4E8;--border2:#A8BCE0;
  --text:#0D1526;--text2:#2D4268;--text3:#6B82A8;
  --accent:#0369A1;--accent-dim:#DBEAFE;
  --emerald:#047857;--emerald-dim:#D1FAE5;
  --rose:#BE123C;--rose-dim:#FFE4E6;
  --amber:#B45309;--amber-dim:#FEF3C7;
  --orange:#C2410C;--orange-dim:#FFEDD5;
  --purple:#6D28D9;--purple-dim:#EDE9FE;
}
*{box-sizing:border-box;margin:0;padding:0;transition:background-color .15s,border-color .15s,color .12s;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:width .22s cubic-bezier(.4,0,.2,1);}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-logo{padding:0 14px;height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;flex-shrink:0;}
.logo-wrap{opacity:1;transition:opacity .15s .05s;flex:1;min-width:0;}
.sidebar.collapsed .logo-wrap{opacity:0;pointer-events:none;}
.logo-icon{width:28px;height:28px;background:var(--purple);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.logo-text{font-size:14px;font-weight:700;color:var(--text);}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px;}
.sidebar-nav{flex:1;padding:8px 0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;}
.nav-divider{height:1px;background:var(--border);margin:6px 8px;}
.nav-grp{display:flex;flex-direction:column;}
.nav-grp-btn{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;}
.nav-grp-btn:hover,.nav-grp-btn.grp-active{color:var(--purple);}
.nav-grp-btn:hover{background:var(--surface2);}
.nav-icon{font-size:18px;flex-shrink:0;width:22px;text-align:center;}
.nav-label{transition:opacity .18s,max-width .22s;overflow:hidden;max-width:180px;}
.nav-grp-chevron{margin-left:auto;font-size:9px;opacity:.5;flex-shrink:0;transition:transform .2s;}
.nav-grp-btn.open .nav-grp-chevron{transform:rotate(180deg);opacity:1;}
.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-grp-chevron{opacity:0;max-width:0;pointer-events:none;}
.sidebar.collapsed .nav-grp-btn{padding:9px 0;justify-content:center;gap:0;}
.sidebar.collapsed .nav-sub{display:none;}
.nav-sub{display:flex;flex-direction:column;overflow:hidden;max-height:0;transition:max-height .25s cubic-bezier(.4,0,.2,1);}
.nav-sub.open{max-height:400px;}
.nav-sub-btn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 42px;font-size:12.5px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;border-radius:var(--radius-sm);white-space:nowrap;}
.nav-sub-btn:hover{background:var(--surface2);color:var(--text);}
.nav-sub-btn.active{background:var(--purple-dim);color:var(--purple);font-weight:600;}
.sidebar-footer{padding:8px 0;border-top:1px solid var(--border);flex-shrink:0;}
.footer-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;border-radius:var(--radius-sm);}
.footer-btn:hover{background:var(--surface2);}
.footer-label{transition:opacity .18s,max-width .22s;overflow:hidden;max-width:180px;}
.sidebar.collapsed .footer-label{opacity:0;max-width:0;pointer-events:none;}
.sidebar.collapsed .footer-btn{padding:9px 0;justify-content:center;gap:0;}
.sb-toggle{position:fixed;top:50%;left:calc(var(--sidebar-w) - 1px);transform:translateY(-50%);z-index:200;width:18px;height:48px;background:var(--surface);border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:left .22s cubic-bezier(.4,0,.2,1);box-shadow:2px 0 6px rgba(0,0,0,.15);}
.sb-toggle:hover{background:var(--surface2);color:var(--text);}
.sb-toggle svg{transition:transform .22s;}
:root.sb-collapsed .sb-toggle{left:calc(var(--sidebar-w-collapsed) - 1px);}
:root.sb-collapsed .sb-toggle svg{transform:rotate(180deg);}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column;transition:margin-left .22s cubic-bezier(.4,0,.2,1);}
:root.sb-collapsed .main{margin-left:var(--sidebar-w-collapsed);}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:14px;font-weight:700;color:var(--text);flex:1;}
.tab-bar{display:flex;padding:0 24px;gap:2px;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;flex-shrink:0;position:sticky;top:var(--header-h);z-index:40;}
.tab-btn{padding:10px 14px;font-size:12px;font-weight:600;border:none;background:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font);}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--purple);border-bottom-color:var(--purple);}
.tab-pane{display:none;padding:20px 24px;flex-direction:column;gap:16px;}
.tab-pane.active{display:flex;}

/* KPI / CARDS */
.kpi-strip{display:flex;gap:10px;flex-wrap:nowrap;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;flex:1;min-width:0;}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:4px;}
.kpi-val{font-size:15px;font-weight:800;font-family:var(--mono);line-height:1.2;}
.kpi-note{font-size:10px;color:var(--text3);margin-top:3px;}
.kpi.sar .kpi-val{color:var(--accent);}
.kpi.pkr .kpi-val{color:var(--emerald);}
.kpi.visa .kpi-val{color:var(--amber);}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;}
.sum-icon{font-size:26px;flex-shrink:0;}
.sum-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);}
.sum-val{font-size:18px;font-weight:800;font-family:var(--mono);margin-top:3px;}
.sum-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-head{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);}
.card-body{padding:14px 16px;}
.cc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.cc-item:last-child{border-bottom:none;}
.visa-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.vs-item{background:var(--surface2);border-radius:var(--radius-sm);padding:8px 12px;}
.vs-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.vs-val{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--text);margin-top:2px;}
.prog-bar{background:var(--surface2);border-radius:20px;height:12px;overflow:hidden;border:1px solid var(--border);}
.prog-fill{background:linear-gradient(90deg,var(--amber),#FCD34D);height:100%;border-radius:20px;transition:width .8s;}
.gap-badge{display:inline-flex;align-items:center;gap:5px;background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;font-family:var(--mono);margin-top:10px;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.red{background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);}
.badge.green{background:var(--emerald-dim);color:var(--emerald);border:1px solid var(--emerald);}
.badge.amber{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);}
.badge.blue{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);}
.badge.gray{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.badge.purple{background:var(--purple-dim);color:var(--purple);border:1px solid var(--purple);}
.urgent-grid{display:flex;flex-direction:column;gap:6px;}
.urgent-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);}
.urgent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.urgent-desc{flex:1;font-size:12.5px;font-weight:500;color:var(--text);}
.urgent-note{font-size:11px;color:var(--text3);margin-left:8px;}
.urgent-amt{font-size:12px;font-family:var(--mono);color:var(--text2);flex-shrink:0;}

/* TABLES */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{background:var(--surface2);color:var(--text3);padding:8px 12px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{border-bottom:1px solid var(--border);padding:8px 12px;color:var(--text2);white-space:nowrap;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:var(--surface2);}
.tbl .total-row td{font-weight:700;color:var(--text);border-top:1px solid var(--border2);background:var(--surface2);}
.tbl .muted-row td{color:var(--text3);}
.num{font-family:var(--mono);}
.pri-high{color:var(--rose);font-weight:700;}
.pri-return{color:var(--rose);}
.pri-next{color:var(--amber);font-weight:600;}
.pri-queue{color:var(--amber);}
.pri-assigned{color:var(--accent);}
.pri-waiting{color:var(--text3);}
.pri-watch{color:var(--orange);}
.pri-loan{color:var(--purple);}

/* COMBINED FORM */
.form-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
.form-top-row{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--border);}
.cat-select{width:100%;font-size:14px;font-weight:600;padding:12px 14px;background:var(--surface2);border:1px solid var(--purple);border-radius:var(--radius);color:var(--text);cursor:pointer;outline:none;}
.cat-select:focus{border-color:var(--purple);}
.cat-desc strong{display:block;font-size:13px;color:var(--purple);margin-bottom:6px;}
.cat-desc p{font-size:13px;color:var(--text3);line-height:1.65;}
.field-group{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.field-group.hidden{display:none;}
.fg-full{grid-column:1/-1;}
.fg-half{grid-column:span 2;}
.fg-1{grid-column:span 1;}
.form-group{display:flex;flex-direction:column;gap:6px;}
label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
select,input[type=text],input[type=number],textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;color:var(--text);font-family:var(--font);width:100%;outline:none;}
select:focus,input:focus,textarea:focus{border-color:var(--purple);}
textarea{resize:vertical;min-height:68px;}
.form-footer{display:none;align-items:center;gap:12px;padding-top:20px;margin-top:16px;border-top:1px solid var(--border);}
.form-footer.visible{display:flex;}
.btn-save{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);}
.btn-save:hover{opacity:.85;}
.form-status{font-size:12px;font-weight:600;font-family:var(--mono);}

/* SEARCH */
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.filter-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:7px;}
.filter-pills{display:flex;flex-wrap:wrap;gap:6px;}
.fpill{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--text3);cursor:pointer;font-family:var(--font);}
.fpill:hover{border-color:var(--purple);color:var(--text);}
.fpill.active{background:var(--purple-dim);border-color:var(--purple);color:var(--purple);}
.search-row{display:flex;gap:10px;align-items:flex-end;}
.search-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 13px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;}
.search-input:focus{border-color:var(--purple);}
.search-mini{width:100px;}
.search-btn{padding:9px 20px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;}
.search-results{display:flex;flex-direction:column;gap:8px;}
.sr-none{font-size:13px;color:var(--text3);padding:28px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);}
.sr-hit{color:var(--purple);font-weight:700;}
.goals-grid{display:flex;flex-direction:column;gap:6px;}
.goal-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:var(--radius-sm);background:var(--surface2);gap:8px;}
.goal-name{font-size:12px;font-weight:600;color:var(--text);flex:1;min-width:0;}
.load-state{display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:12px;color:var(--text3);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div style="display:flex;min-height:100vh">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">💰</div>
    <div class="logo-wrap">
      <div class="logo-text">PSX Analysis</div>
      <div class="logo-sub">Personal Finance</div>
    </div>
  </div>
  <nav class="sidebar-nav">

    <div class="nav-grp">
      <button class="nav-grp-btn" onclick="toggleGrp(this,'taSub')">
        <span class="nav-icon">📊</span><span class="nav-label"> Technical Analysis</span><span class="nav-grp-chevron">▼</span>
      </button>
      <div class="nav-sub" id="taSub">
        <button class="nav-sub-btn" onclick="location.href='index.html'">⌂ Dashboard</button>
      </div>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-grp">
      <button class="nav-grp-btn" onclick="toggleGrp(this,'portSub')">
        <span class="nav-icon">📈</span><span class="nav-label"> Portfolio</span><span class="nav-grp-chevron">▼</span>
      </button>
      <div class="nav-sub" id="portSub">
        <button class="nav-sub-btn" onclick="location.href='portfolio.html'">📊 Dashboard</button>
      </div>
    </div>

    <div class="nav-divider"></div>

    <!-- Personal Finance group — open by default -->
    <div class="nav-grp">
      <button class="nav-grp-btn grp-active open" onclick="toggleGrp(this,'pfSub')">
        <span class="nav-icon">💰</span><span class="nav-label"> Personal Finance</span><span class="nav-grp-chevron">▼</span>
      </button>
      <div class="nav-sub open" id="pfSub">
        <button class="nav-sub-btn active" data-tab="overview"    onclick="switchTab('overview',this)">🏦 Overview</button>
        <button class="nav-sub-btn"        data-tab="debts"       onclick="switchTab('debts',this)">📋 Debts</button>
        <button class="nav-sub-btn"        data-tab="receivables" onclick="switchTab('receivables',this)">📥 Receivables</button>
        <button class="nav-sub-btn"        data-tab="goals"       onclick="switchTab('goals',this)">🎯 Goals</button>
        <button class="nav-sub-btn"        data-tab="income"      onclick="switchTab('income',this)">💵 Income</button>
        <button class="nav-sub-btn"        data-tab="abdullah"    onclick="switchTab('abdullah',this)">🏦 Abdullah A/C</button>
        <button class="nav-sub-btn"        data-tab="forms"       onclick="switchTab('forms',this)">📝 Forms</button>
        <button class="nav-sub-btn"        data-tab="search"      onclick="switchTab('search',this)">🔍 Search</button>
      </div>
    </div>

  </nav>
  <div class="sidebar-footer">
    <button class="footer-btn" onclick="toggleTheme()">
      <span id="themeIcon" style="font-size:15px">☀️</span>
      <span class="footer-label" id="themeLbl"> Light Mode</span>
    </button>
    <button class="footer-btn" onclick="location.reload()">
      <span style="font-size:15px">↺</span><span class="footer-label"> Refresh</span>
    </button>
  </div>
</aside>

<button class="sb-toggle" onclick="toggleSidebar()">
  <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
    <path d="M7 2L2 8l5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">Personal Finance</div>
    <span style="font-size:11px;color:var(--text3);font-family:var(--mono)" id="asofDate"></span>
    <span id="loadBadge" style="font-size:11px;color:var(--text3)">Loading…</span>
  </div>

  <!-- STICKY TAB BAR -->
  <div class="tab-bar" id="tabBar" style="display:none">
    <button class="tab-btn active" data-tab="overview"    onclick="switchTab('overview',this)">🏦 Overview</button>
    <button class="tab-btn"        data-tab="debts"       onclick="switchTab('debts',this)">📋 Debts</button>
    <button class="tab-btn"        data-tab="receivables" onclick="switchTab('receivables',this)">📥 Receivables</button>
    <button class="tab-btn"        data-tab="goals"       onclick="switchTab('goals',this)">🎯 Goals</button>
    <button class="tab-btn"        data-tab="income"      onclick="switchTab('income',this)">💵 Income</button>
    <button class="tab-btn"        data-tab="abdullah"    onclick="switchTab('abdullah',this)">🏦 Abdullah A/C</button>
    <button class="tab-btn"        data-tab="forms"       onclick="switchTab('forms',this)">📝 Forms</button>
    <button class="tab-btn"        data-tab="search"      onclick="switchTab('search',this)">🔍 Search</button>
  </div>

  <div class="load-state" id="loadState">
    <div class="spinner"></div><span>Loading budget data…</span>
  </div>

  <div id="tabOverview"    class="tab-pane active"></div>
  <div id="tabDebts"       class="tab-pane"></div>
  <div id="tabReceivables" class="tab-pane"></div>
  <div id="tabGoals"       class="tab-pane"></div>
  <div id="tabIncome"      class="tab-pane"></div>
  <div id="tabAbdullah"    class="tab-pane"></div>
  <div id="tabForms"       class="tab-pane"></div>
  <div id="tabSearch"      class="tab-pane"></div>
</main>
</div>

<script>
/* ────────── CONFIG ────────── */

/* ── CSV + SECTION PARSE ── */
function parseCSV(text){
  const rows=[];
  for(const line of text.split('\n')){
    if(!line.trim()) continue;
    const row=[];let f='';let q=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(q&&line[i+1]==='"'){f+='"';i++;}else q=!q;}
      else if(c===','&&!q){row.push(f.trim());f='';}
      else f+=c;
    }
    row.push(f.trim());rows.push(row);
  }
  return rows;
}
const SEC_KEYS=['PROFILE','BALANCES','CREDIT CARDS','VISA FUND','DEBTS','RECEIVABLES','GOALS & TARGETS'];
function isSec(s){return SEC_KEYS.includes(s)||/^INCOME HISTORY/i.test(s)||/^ABDULLAH MEEZAN/i.test(s);}
function parseSections(rows){
  const secs={};const ord=[];let cur=null;let gotH=false;
  for(const row of rows){
    const f=(row[0]||'').trim();if(!f) continue;
    if(isSec(f)){cur=f;secs[cur]={headers:[],data:[]};ord.push(cur);gotH=false;continue;}
    if(cur&&!gotH){secs[cur].headers=row;gotH=true;continue;}
    if(cur) secs[cur].data.push([...row]);
  }
  return{secs,ord};
}

function badge(p){if(!p) return'';const m={'HIGH':'red','RETURN':'red','NEXT':'amber','QUEUE':'amber','ASSIGNED':'blue','WAITING':'gray','WATCH':'purple','LOAN':'purple','DONE':'green','PAID 31-Jul':'green','GAP PKR 903,622':'red'};return`<span class="badge ${m[p]||'gray'}">${p}</span>`;}

function onCatChange(){
  const cat=document.getElementById('f-cat').value;
  const desc=CAT_DESC[cat];
  document.getElementById('f-desc').innerHTML=desc?`<strong>${desc.title}</strong><p>${desc.body}</p>`:'<strong>Choose an update type</strong><p>Select from the dropdown on the left.</p>';
  ['fg-bal','fg-debt','fg-recv'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('f-footer').classList.toggle('visible',!!cat);

  if(cat==='balance') document.getElementById('fg-bal').classList.remove('hidden');
  else if(cat.startsWith('debt')){
    const isAdd=cat==='debt-add';
    document.getElementById('fg-debt').classList.remove('hidden');
    document.getElementById('fd-sel-wrap').classList.toggle('hidden',isAdd);
    document.getElementById('fd-new-wrap').classList.toggle('hidden',!isAdd);
  }
  else if(cat.startsWith('recv')){
    const isAdd=cat==='recv-add';
    document.getElementById('fg-recv').classList.remove('hidden');
    document.getElementById('fr-sel-wrap').classList.toggle('hidden',isAdd);
    document.getElementById('fr-new-wrap').classList.toggle('hidden',!isAdd);
  }
}

function saveForm(){
  const cat=document.getElementById('f-cat').value;
  if(!cat) return;
  if(cat==='balance') doSaveBalance();
  else if(cat.startsWith('debt')) doSaveDebt(cat==='debt-add');
  else if(cat.startsWith('recv')) doSaveRecv(cat==='recv-add');
}

════════════════════════════════════ */
function renderSearch(){
  document.getElementById('tabSearch').innerHTML=`
  <div class="search-box">
    <!-- Section filter -->
    <div>
      <div class="filter-label">Section</div>
      <div class="filter-pills" id="pill-sec">
        <button class="fpill active" onclick="sf('section','',this)">All Sections</button>
        <button class="fpill" onclick="sf('section','BALANCES',this)">💰 Balances</button>
        <button class="fpill" onclick="sf('section','CREDIT CARDS',this)">💳 Credit Cards</button>
        <button class="fpill" onclick="sf('section','VISA FUND',this)">🎯 Visa Fund</button>
        <button class="fpill" onclick="sf('section','DEBTS',this)">📋 Debts</button>
        <button class="fpill" onclick="sf('section','RECEIVABLES',this)">📥 Receivables</button>
        <button class="fpill" onclick="sf('section','INCOME',this)">💵 Income</button>
        <button class="fpill" onclick="sf('section','ABDULLAH',this)">🏦 Abdullah A/C</button>
        <button class="fpill" onclick="sf('section','GOALS',this)">🎯 Goals</button>
      </div>
    </div>
    <!-- Contextual sub-filter (priority / certainty) -->
    <div id="subfilter" style="display:none"></div>
    <!-- Keyword + amount range -->
    <div class="search-row">
      <div style="flex:1">
        <div class="filter-label">Keyword</div>
        <input class="search-input" id="srch-kw" placeholder="Name, amount, date, note, account…" oninput="doSearch()">
      </div>
      <div>
        <div class="filter-label">Min PKR</div>
        <input class="search-input search-mini" id="srch-min" type="number" placeholder="0" oninput="doSearch()">
      </div>
      <div>
        <div class="filter-label">Max PKR</div>
        <input class="search-input search-mini" id="srch-max" type="number" placeholder="∞" oninput="doSearch()">
      </div>
      <div style="align-self:flex-end">
        <button class="search-btn" onclick="doSearch()">🔍 Search</button>
      </div>
    </div>
  </div>
  <div class="search-results" id="srch-res">
    <div class="sr-none">Use the section pills, priority/certainty filters, or type a keyword</div>
  </div>`;
}

function sf(type,val,btn){
  _SF[type]=val;
  btn.closest('.filter-pills').querySelectorAll('.fpill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const sub=document.getElementById('subfilter');
  if(type==='section'){
    _SF.priority='';_SF.certainty='';
    if(val==='DEBTS'){
      sub.style.display='block';
      sub.innerHTML=`<div class="filter-label">Priority</div><div class="filter-pills">
        <button class="fpill active" onclick="sf('priority','',this)">All</button>
        ${['HIGH','RETURN','NEXT','QUEUE','ASSIGNED','WAITING','WATCH','LOAN'].map(p=>`<button class="fpill" onclick="sf('priority','${p}',this)">${p}</button>`).join('')}
      </div>`;
    }else if(val==='RECEIVABLES'){
      sub.style.display='block';
      sub.innerHTML=`<div class="filter-label">Certainty</div><div class="filter-pills">
        <button class="fpill active" onclick="sf('certainty','',this)">All</button>
        ${['Confirmed','Expected','Uncertain'].map(c=>`<button class="fpill" onclick="sf('certainty','${c}',this)">${c}</button>`).join('')}
      </div>`;
    }else sub.style.display='none';
  }
  doSearch();
}

function doSearch(){
  const kw=(document.getElementById('srch-kw')?.value||'').trim().toLowerCase();
  const minP=parseFloat(document.getElementById('srch-min')?.value)||0;
  const maxP=parseFloat(document.getElementById('srch-max')?.value)||Infinity;
  const{section,priority,certainty}=_SF;
  const hasFilter=section||priority||certainty||kw||minP>0||maxP<Infinity;
  const out=document.getElementById('srch-res');
  if(!hasFilter){out.innerHTML='<div class="sr-none">Use the section pills, priority/certainty filters, or type a keyword</div>';return;}

  const results=[];
  for(const name of _sectionOrder){
    if(section){
      const nm=name.toUpperCase();
      if(section==='INCOME'&&!/INCOME/.test(nm)) continue;
      else if(section==='ABDULLAH'&&!/ABDULLAH/.test(nm)) continue;
      else if(section==='GOALS'&&nm!=='GOALS & TARGETS') continue;
      else if(!['INCOME','ABDULLAH','GOALS'].includes(section)&&nm!==section) continue;
    }
    const sec=_sections[name];if(!sec) continue;
    for(const row of sec.data){
      if(priority&&!row.includes(priority)) continue;
      if(certainty&&!row.includes(certainty)) continue;
      if(kw&&!row.join(' ').toLowerCase().includes(kw)) continue;
      if(minP>0||maxP<Infinity){
        const nums=row.map(c=>parseFloat(c)).filter(v=>!isNaN(v)&&v>100);
        if(!nums.some(v=>v>=minP&&v<=maxP)) continue;
      }
      results.push({section:name,headers:sec.headers,row});
    }
  }

  if(!results.length){out.innerHTML='<div class="sr-none">No results matching the selected filters</div>';return;}

  const grouped={};
  for(const r of results){if(!grouped[r.section]) grouped[r.section]={h:r.headers,rows:[]};grouped[r.section].rows.push(r.row);}

  out.innerHTML=Object.entries(grouped).map(([sec,g])=>{
    const hdrs=g.h.filter(h=>h);
    const tRows=g.rows.map(row=>`<tr>${hdrs.map((_,i)=>{const c=row[i]||'';const hi=kw&&c.toLowerCase().includes(kw);return`<td class="${hi?'sr-hit num':''}">${c}</td>`;}).join('')}</tr>`).join('');
    return`<div class="card" style="margin-bottom:8px"><div class="card-head"><span class="card-title">${sec}</span><span style="margin-left:auto;font-size:11px;color:var(--text3)">${g.rows.length} result${g.rows.length>1?'s':''}</span></div>
      <div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl"><thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${tRows}</tbody></table></div></div></div>`;
  }).join('');
}

/* ════════════════════════════════════
   SHEET WRITE
════════════════════════════════════ */
function buildRows(){
  const rows=[];
  for(const name of _sectionOrder){
    const sec=_sections[name];if(!sec) continue;
    rows.push(Array(7).fill(''));
    rows.push([name,...Array(6).fill('')]);
    rows.push(sec.headers.length<7?[...sec.headers,...Array(7-sec.headers.length).fill('')]:sec.headers);
    for(const r of sec.data) rows.push(r.length<7?[...r,...Array(7-r.length).fill('')]:r.slice(0,7));
  }
  return rows;
}
async function writeSheet(statusId){
  const el=document.getElementById(statusId);
  el.textContent='⏳ Saving…';el.style.color='var(--amber)';
  try{
    const resp=await fetch(GS_WRITE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'replaceSheet',tab:SHEET_TAB,rows:buildRows()})});
    const result=await resp.json();
    if(result&&result.error) throw new Error(result.error);
    el.textContent='✅ Saved!';el.style.color='var(--emerald)';
    setTimeout(()=>{el.textContent='';},3000);
    await load();
  }catch(e){el.textContent='❌ '+e.message;el.style.color='var(--rose)';}
}

function doSaveBalance(){
  const acct=document.getElementById('fb-acc').value;
  const amt=(document.getElementById('fb-amt').value||'').trim();
  if(!amt){document.getElementById('f-status').textContent='Enter a balance.';return;}
  const data=(_sections['BALANCES']||{data:[]}).data;
  for(const row of data){if(row[0]===acct){row[2]=amt;const n=document.getElementById('fb-note').value.trim();if(n) row[3]=n;break;}}
  writeSheet('f-status');
}
function doSaveDebt(isAdd){
  const data=(_sections['DEBTS']||{data:[]}).data;
  const s=(document.getElementById('fd-sar').value||'').trim();
  const p=(document.getElementById('fd-pkr').value||'').trim();
  const pri=document.getElementById('fd-pri').value;
  const note=(document.getElementById('fd-note').value||'').trim();
  if(isAdd){
    const nm=(document.getElementById('fd-new').value||'').trim();
    if(!nm){document.getElementById('f-status').textContent='Enter a person name.';return;}
    const tI=data.findIndex(r=>r[1]==='TOTAL');
    const no=String(tI>0?tI:data.length+1);
    const row=[no,nm,s||'0',p||'0',pri,note,''];
    tI>=0?data.splice(tI,0,row):data.push(row);
    const tot=data.find(r=>r[1]==='TOTAL');
    if(tot){
      const ts=data.filter(r=>r[1]&&r[1]!=='TOTAL').reduce((a,r)=>a+nv(r[2]),0);
      const tp=data.filter(r=>r[1]&&r[1]!=='TOTAL').reduce((a,r)=>a+nv(r[3]),0);
      tot[2]=ts.toFixed(2);tot[3]=String(Math.round(tp));
    }
  }else{
    const person=document.getElementById('fd-sel').value;
    for(const row of data){if(row[1]===person){if(s)row[2]=s;if(p)row[3]=p;row[4]=pri;if(note)row[5]=note;break;}}
  }
  writeSheet('f-status');
}
function doSaveRecv(isAdd){
  const data=(_sections['RECEIVABLES']||{data:[]}).data;
  const p=(document.getElementById('fr-pkr').value||'').trim();
  const s=(document.getElementById('fr-sar').value||'').trim();
  const cert=document.getElementById('fr-cert').value;
  const note=(document.getElementById('fr-note').value||'').trim();
  if(isAdd){
    const from=(document.getElementById('fr-new').value||'').trim();
    if(!from){document.getElementById('f-status').textContent='Enter a name.';return;}
    const tI=data.findIndex(r=>(r[0]||'').includes('Total'));
    const row=[from,p||'0',s||'',cert,note,'',''];
    tI>=0?data.splice(tI,0,row):data.push(row);
    const tot=data.find(r=>(r[0]||'').includes('Total'));
    if(tot){const tp=data.filter(r=>r[0]&&!r[0].includes('Total')&&(r[3]==='Confirmed'||r[3]==='Expected')).reduce((a,r)=>a+nv(r[1]),0);tot[1]=String(Math.round(tp));}
  }else{
    const from=document.getElementById('fr-sel').value;
    for(const row of data){if(row[0]===from){if(p)row[1]=p;if(s)row[2]=s;row[3]=cert;if(note)row[4]=note;break;}}
  }
  writeSheet('f-status');
}

/* ════════════════════════════════════
   LOAD
════════════════════════════════════ */
async function load(){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}&_=${Date.now()}`;
    const resp=await fetch(url);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const parsed=parseSections(parseCSV(await resp.text()));
    _sections=parsed.secs;_sectionOrder=parsed.ord;
    renderOverview();renderDebts();renderReceivables();renderGoals();renderIncome();renderAbdullah();renderForms();renderSearch();
    document.getElementById('loadState').style.display='none';
    document.getElementById('tabBar').style.display='flex';
    document.getElementById('loadBadge').textContent='';
    document.getElementById('asofDate').textContent='Updated: '+new Date().toLocaleDateString('en-PK',{year:'numeric',month:'short',day:'numeric'});
  }catch(e){
    document.getElementById('loadState').innerHTML=`<span style="color:var(--rose)">⚠ ${e.message}</span><br><span style="font-size:12px;color:var(--text3);margin-top:8px">Make sure the Budget sheet is public. Refresh to retry.</span>`;
  }
}
load();
</script>
