name: Pull price history
on:
  schedule:
    - cron: '30 13 * * 1-4'   # Mon-Thu, 18:30 PKT (after close)
    - cron: '0 12 * * 5'    # Fri, 17:00 PKT (market closes 16:30, history ready by 17:00)
  workflow_dispatch:
  push:
    paths:
      - 'scripts/pull_history.py'
      - '.github/workflows/pull-history.yml'
permissions:
  contents: write
concurrency:
  group: pull-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull daily candles
        run: python scripts/pull_history.py
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers/history.json
          git diff --cached --quiet || (git commit -m "Tickers: price history $(date -u +%F)" && git pull --rebase -q && git push -q)
