name: Pull price history
on:
  schedule:
    - cron: '30 13 * * 1-5'   # Mon-Fri, 18:30 Pakistan time (after the close)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pull-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull daily candles
        run: python scripts/pull_history.py
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers/history.json
          git diff --cached --quiet || (git commit -m "Tickers: price history $(date -u +%F)" && git pull --rebase -q && git push -q)
