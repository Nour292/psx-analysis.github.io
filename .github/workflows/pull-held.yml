name: Pull held stocks
on:
  schedule:
    - cron: '35 4-10 * * 1-5'  # 9:35–15:35 PKT Mon–Fri (hourly, 5 min after news)
    - cron: '5 11 * * 1-4'     # 16:05 PKT Mon–Thu (last run)
    - cron: '35 11 * * 5'      # 16:35 PKT Friday
    - cron: '5 12 * * 5'       # 17:05 PKT Friday (last run)
  workflow_dispatch:
  push:
    paths:
      - 'scripts/pull_held.py'
      - '.github/workflows/pull-held.yml'
permissions:
  contents: write
concurrency:
  group: pull-held
  cancel-in-progress: false
jobs:
  held:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull news, EPS and dividends of held stocks
        run: python scripts/pull_held.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers/held.json
          git diff --cached --quiet || (git commit -m "Held stocks: news, EPS, dividends $(date -u +%F)" && git pull --rebase -q && git push -q)
