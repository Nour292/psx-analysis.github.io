name: Pull held stocks
on:
  schedule:
    - cron: '10 13 * * 1-5'   # Mon-Fri, 18:10 Pakistan time
  workflow_dispatch:
  push:
    paths:
      - 'scripts/pull_held.py'
      - '.github/workflows/pull-held.yml'
permissions:
  contents: write
concurrency:
  group: pull-held
  cancel-in-progress: false
jobs:
  held:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull news, EPS and dividends of held stocks
        run: python scripts/pull_held.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers/held.json
          git diff --cached --quiet || (git commit -m "Held stocks: news, EPS, dividends $(date -u +%F)" && git pull --rebase -q && git push -q)
