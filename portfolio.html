<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PSX Portfolio — Dividend Dashboard</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Segoe UI',Arial,sans-serif; background:#0f1923; color:#e0e6ed; min-height:100vh; }

/* NAV */
.nav{ background:#1a2535; border-bottom:2px solid #2e4060; padding:10px 20px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.nav-logo{ font-size:18px; font-weight:700; color:#4fc3f7; margin-right:6px; }
.btn{ padding:8px 18px; border:none; border-radius:6px; font-size:13px; font-weight:600;
  cursor:pointer; transition:all .15s; height:38px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn-ta  { background:#1565c0; color:#fff; width:200px; }
.btn-ta:hover{ background:#1976d2; }
.btn-load{ background:#2e7d32; color:#fff; width:180px; }
.btn-load:hover{ background:#388e3c; }
.asof{ font-size:12px; color:#4fc3f7; background:#0d2a4a; padding:4px 12px;
  border-radius:12px; margin-left:auto; }

/* KPI */
.kpi-bar{ display:flex; gap:12px; padding:14px 20px 8px; flex-wrap:wrap; }
.kpi{ background:#1a2535; border-radius:10px; padding:12px 18px; flex:1; min-width:140px;
  border:1px solid #2e4060; text-align:center; }
.kv{ font-size:20px; font-weight:800; line-height:1.2; }
.kl{ font-size:10px; color:#7a9ab5; margin-top:3px; text-transform:uppercase; letter-spacing:.8px; }
.kpi.c1 .kv{ color:#4fc3f7; } .kpi.c2 .kv{ color:#4caf50; }
.kpi.c3 .kv{ color:#ffc107; } .kpi.c4 .kv{ color:#ff9800; }
.kpi.c5 .kv{ color:#ef5350; }

/* PROGRESS */
.pw{ padding:0 20px 10px; }
.pl{ font-size:12px; color:#7a9ab5; margin-bottom:4px; }
.pb{ background:#1a2535; border-radius:20px; height:14px; overflow:hidden; border:1px solid #2e4060; }
.pf{ background:linear-gradient(90deg,#2e7d32,#4caf50); height:100%; border-radius:20px;
  display:flex; align-items:center; justify-content:flex-end; padding-right:6px; transition:width .8s; }
.pp{ font-size:10px; font-weight:700; color:#fff; }

/* TABS */
.tb{ display:flex; padding:0 20px; border-bottom:2px solid #2e4060; }
.tb-btn{ padding:9px 20px; font-size:13px; font-weight:600; border:none; background:none;
  color:#7a9ab5; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
.tb-btn.active{ color:#4fc3f7; border-bottom-color:#4fc3f7; }
.tb-btn:hover:not(.active){ color:#a0c4e8; }
.tp{ display:none; padding:14px 20px; }
.tp.active{ display:block; }

/* TABLES */
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{
  background:#0d2240; color:#7ab3d4; padding:9px 12px; text-align:left;
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
  border-bottom:2px solid #1565c0; white-space:nowrap;
}
.tbl td{ border-bottom:1px solid #131f2e; padding:8px 12px; text-align:left; font-size:13px; }
.tbl tr:hover td{ background:#1a2535; }
.tbl tr:last-child td{ border-bottom:none; }

/* ROW COLORS by action */
.r-buy  td{ border-left:3px solid #4caf50; }
.r-watch td{ border-left:3px solid #ffc107; }
.r-wait  td{ border-left:3px solid #78909c; }

/* VALUE COLORS */
.c-green{ color:#4caf50; font-weight:700; }
.c-red  { color:#ef5350; font-weight:700; }
.c-blue { color:#4fc3f7; font-weight:700; }
.c-gold { color:#ffc107; font-weight:700; }
.c-gray { color:#78909c; }
.bold   { font-weight:700; }
.sym    { font-size:14px; font-weight:800; color:#e0e6ed; }

/* ACTION BADGES */
.badge{ display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:700; }
.b-buy  { background:#1b5e20; color:#4caf50; }
.b-watch{ background:#1a1a00; color:#ffc107; }
.b-wait { background:#1a1a2e; color:#78909c; }

/* PRICE NOTE */
.price-note{ font-size:11px; color:#4a6a8a; margin-bottom:8px; padding:6px 10px;
  background:#0d1923; border-radius:4px; border-left:2px solid #2e4060; }

/* TOTAL ROW */
.total-row td{ background:#1e3050; font-weight:700; border-top:2px solid #2e4060; }

/* SECTOR BARS */
.sec-wrap{ max-width:900px; }
.sec-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.sec-lbl{ min-width:220px; font-size:14px; font-weight:700; color:#a0c4e8; text-align:left; }
.sec-bar{ flex:1; background:#1a2535; border-radius:6px; height:28px;
  overflow:hidden; border:1px solid #2e4060; position:relative; min-width:200px; }
.sec-fill{ height:100%; border-radius:6px; display:flex; align-items:center;
  padding:0 10px; font-size:12px; font-weight:700; color:#fff; }
.sf-ok  { background:#1565c0; }
.sf-over{ background:#b71c1c; }
.sf-under{ background:#1b5e20; }
.sec-tgt{ position:absolute; top:0; bottom:0; width:2px; background:#ffc107; opacity:.8; }
.sec-flag{ min-width:80px; font-size:13px; font-weight:700; text-align:left; }
.sec-amt{ min-width:110px; font-size:12px; color:#7a9ab5; text-align:left; }

/* DIVIDEND PROGRESS */
.div-prog{ background:#1a2535; border-radius:8px; padding:14px 18px; margin-top:14px; }
.dp-row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
.div-total{ background:#1b5e20; border-radius:8px; padding:12px 18px; margin-top:12px;
  display:flex; justify-content:space-between; align-items:center; }
.dt-lbl{ font-size:13px; color:#a5d6a7; }
.dt-val{ font-size:22px; font-weight:800; color:#4caf50; }

/* ALERT */
.alert{ background:#1a1a00; border:1px solid #ffc107; border-radius:8px;
  padding:10px 16px; font-size:13px; color:#ffc107; margin-bottom:12px; }
</style>
</head>
<body>

<div class="nav">
  <span class="nav-logo">📈 PSX Portfolio</span>
  <button class="btn btn-ta" onclick="window.location.href='index.html'">📊 Technical Analysis</button>
  <button class="btn btn-load" onclick="document.getElementById('csvUpload').click()">📂 Load Holdings</button>
  <input type="file" id="csvUpload" accept=".csv" onchange="loadCSV(event)" style="display:none">
  <span class="asof" id="asofBadge" style="display:none">📅 As of: <b id="asofVal"></b></span>
</div>

<!-- KPI -->
<div class="kpi-bar">
  <div class="kpi c1"><div class="kv" id="kInvested">—</div><div class="kl">Invested Capital</div></div>
  <div class="kpi c2"><div class="kv" id="kDivIncome">—</div><div class="kl">Annual Dividend</div></div>
  <div class="kpi c3"><div class="kv" id="kWorth">—</div><div class="kl">Portfolio Worth</div></div>
  <div class="kpi c5"><div class="kv" id="kPL">—</div><div class="kl">Unrealised P/L</div></div>
  <div class="kpi c4"><div class="kv" id="kProgress">—</div><div class="kl">To PKR 1M Target</div></div>
</div>

<!-- PROGRESS -->
<div class="pw">
  <div class="pl">Dividend Income Progress → PKR 1,000,000 / year</div>
  <div class="pb"><div class="pf" id="progFill" style="width:0%"><span class="pp" id="progPct"></span></div></div>
</div>

<!-- TABS -->
<div class="tb">
  <button class="tb-btn active" onclick="showTab('action',this)">🎯 Action Plan</button>
  <button class="tb-btn"        onclick="showTab('portfolio',this)">📋 Portfolio</button>
  <button class="tb-btn"        onclick="showTab('dividend',this)">💰 Dividend Income</button>
  <button class="tb-btn"        onclick="showTab('sector',this)">⚖️ Sector Balance</button>
</div>

<div id="tab-action"    class="tp active"><p class="c-gray" style="padding:20px">Loading...</p></div>
<div id="tab-portfolio" class="tp"><p class="c-gray" style="padding:20px">Loading...</p></div>
<div id="tab-dividend"  class="tp"><p class="c-gray" style="padding:20px">Loading...</p></div>
<div id="tab-sector"    class="tp"><p class="c-gray" style="padding:20px">Loading...</p></div>

<script>
// ── CONSTANTS ─────────────────────────────────
const DPS = {
  HUBC:20, POL:75, UBL:40, FFC:34, MCB:36,
  OGDC:14.50, MTL:17.50, EFERT:13, BAFL:3, MEBL:30, HBL:22
};
const SECTOR = {
  HUBC:'Rental Power',
  POL:'Oil and Gas', OGDC:'Oil and Gas',
  UBL:'Banking', MCB:'Banking', MEBL:'Banking', HBL:'Banking', BAFL:'Banking', NBP:'Banking',
  FFC:'Fertilizer', EFERT:'Fertilizer',
  MTL:'Automobile Assembler',
  ENGROH:'Other', FCL:'Other', LUCK:'Other', SYS:'Other', ISL:'Other', KAPCO:'Other'
};
const EXCLUDE_SEC = ['ENGROH','FCL'];

let _holdings = [];
let _prices   = {}; // symbol → last known price from data.csv

// ── HELPERS ───────────────────────────────────
function fmtN(n){ return Math.round(n).toLocaleString(); }
function fmtD(n){ return parseFloat(n).toFixed(2); }

// ── TABS ──────────────────────────────────────
function showTab(name, btn){
  document.querySelectorAll('.tp').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tb-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
}

// ── LOAD PRICES FROM data.csv ─────────────────
async function loadDataCSV(){
  try{
    const res  = await fetch('data.csv?'+Date.now());
    if(!res.ok) return;
    const text = (await res.text()).replace(/^\uFEFF/,'');
    const lines= text.trim().split(/\r?\n/);
    const hdrs = lines[0].split(',').map(h=>h.trim());
    const pi   = hdrs.findIndex(h=>h==='Price');
    const si   = hdrs.findIndex(h=>h==='Symbol');
    lines.slice(1).forEach(l=>{
      const cols=l.split(',');
      const sym=(cols[si]||'').trim();
      const p  =parseFloat(cols[pi]);
      if(sym && !isNaN(p)) _prices[sym]=p;
    });
    console.log('Prices loaded:', Object.keys(_prices).length);
  }catch(e){ console.log('data.csv not loaded'); }
}

// ── LOAD HOLDINGS ─────────────────────────────
function loadCSV(e){
  const file=e.target.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=ev=>parseHoldings(ev.target.result.replace(/^\uFEFF/,''));
  r.readAsText(file);
}

function parseHoldings(text){
  const lines  = text.trim().split(/\r?\n/);
  const headers= lines[0].split(',').map(h=>h.trim().toLowerCase());
  const rows   = lines.slice(1).map(line=>{
    const cols=line.split(','); const obj={};
    headers.forEach((h,i)=>obj[h]=(cols[i]||'').trim());
    return obj;
  }).filter(r=>r.symbol&&r.symbol.trim());

  // Latest date
  const lastDate=rows[rows.length-1]?.date||'';
  if(lastDate){
    document.getElementById('asofBadge').style.display='inline-block';
    document.getElementById('asofVal').textContent=lastDate;
  }

  // Calculate weighted avg
  const map={};
  rows.forEach(r=>{
    const sym   =r.symbol.trim().toUpperCase();
    const units =parseFloat(r.units)||0;
    const rate  =parseFloat(r.rate)||0;
    const action=(r.action||'').toLowerCase();
    if(!map[sym]) map[sym]={qty:0,cost:0};
    if(action==='buy'){
      const oq=map[sym].qty,oc=map[sym].cost,nq=oq+units;
      map[sym].cost=nq>0?((oc*oq)+(rate*units))/nq:0;
      map[sym].qty=nq;
    } else if(action==='sell'){
      map[sym].qty=Math.max(0,map[sym].qty-units);
    }
  });

  _holdings=Object.entries(map)
    .filter(([sym,d])=>d.qty>0.5&&sym&&sym.trim())
    .map(([sym,d])=>({
      symbol:sym,
      qty:Math.round(d.qty),
      avg:parseFloat(d.cost.toFixed(2)),
      dps:DPS[sym]||0,
      sector:SECTOR[sym]||'Other',
      price:_prices[sym]||null
    }))
    .sort((a,b)=>(a.symbol||'').localeCompare(b.symbol||''));

  buildAll();
}

// ── BUILD ALL ─────────────────────────────────
function buildAll(){
  if(!_holdings.length) return;

  const totalInv=_holdings.reduce((s,h)=>s+h.qty*h.avg,0);
  const totalDiv=_holdings.reduce((s,h)=>s+h.qty*h.dps,0);
  const totalWorth=_holdings.reduce((s,h)=>s+h.qty*(h.price||h.avg),0);
  const totalPL=totalWorth-totalInv;
  const pct=Math.min((totalDiv/1000000)*100,100);

  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('kInvested','PKR '+fmtN(totalInv));
  set('kDivIncome','PKR '+fmtN(totalDiv));
  set('kWorth','PKR '+fmtN(totalWorth));
  set('kPL',(totalPL>=0?'+':'')+fmtN(totalPL));
  set('kProgress',pct.toFixed(1)+'%');
  document.getElementById('kPL').className='kv '+(totalPL>=0?'c-green':'c-red');

  const pf=document.getElementById('progFill');
  const pp=document.getElementById('progPct');
  if(pf) pf.style.width=pct+'%';
  if(pp) pp.textContent=pct.toFixed(1)+'%';

  try{ buildAction(); }catch(e){ showErr('tab-action',e); }
  try{ buildPortfolio(); }catch(e){ showErr('tab-portfolio',e); }
  try{ buildDividend(); }catch(e){ showErr('tab-dividend',e); }
  try{ buildSector(); }catch(e){ showErr('tab-sector',e); }
}

function showErr(id,e){
  const el=document.getElementById(id);
  if(el) el.innerHTML=`<p style="color:#ef5350;padding:20px">Error: ${e.message}</p>`;
}

// ── ACTION PLAN ───────────────────────────────
// Sort by Action priority: BUY → WATCH → WAIT, then by YoC desc
function buildAction(){
  const ORDER={buy:1,watch:2,wait:3};
  const rows=_holdings.map(h=>{
    const yoc=h.avg>0?(h.dps/h.avg)*100:0;
    const cat=yoc>=8?'buy':yoc>=5?'watch':'wait';
    const lbl=yoc>=8?'BUY — Add more':yoc>=5?'WATCH — Good yield':'WAIT — Monitor';
    const badge=yoc>=8?'b-buy':yoc>=5?'b-watch':'b-wait';
    return {h,yoc,cat,lbl,badge};
  }).sort((a,b)=>ORDER[a.cat]-ORDER[b.cat]||b.yoc-a.yoc);

  let html=`<div style="overflow-x:auto"><table class="tbl">
    <tr>
      <th>Action</th><th>Symbol</th><th>Units</th>
      <th>Avg Cost</th><th>DPS</th><th>Yield on Cost</th>
      <th>Annual Div</th><th>Invested</th>
    </tr>`;
  rows.forEach(({h,yoc,cat,lbl,badge})=>{
    const rcls=`r-${cat}`;
    const ann=h.qty*h.dps;
    html+=`<tr class="${rcls}">
      <td><span class="badge ${badge}">${lbl}</span></td>
      <td class="sym">${h.symbol}</td>
      <td>${h.qty.toLocaleString()}</td>
      <td>${fmtD(h.avg)}</td>
      <td class="c-gold">${h.dps||'—'}</td>
      <td class="${yoc>=8?'c-green':yoc>=5?'c-gold':'c-gray'}"><b>${yoc.toFixed(1)}%</b></td>
      <td>${h.dps?fmtN(ann):'—'}</td>
      <td>${fmtN(h.qty*h.avg)}</td>
    </tr>`;
  });
  html+=`</table></div>`;
  document.getElementById('tab-action').innerHTML=html;
}

// ── PORTFOLIO ─────────────────────────────────
// Sort A-Z, Live Price, P/L
function buildPortfolio(){
  const hasPrices=Object.keys(_prices).length>0;
  const sorted=[..._holdings].sort((a,b)=>(a.symbol||'').localeCompare(b.symbol||''));

  let html='';
  if(hasPrices){
    html+=`<div class="price-note">📡 Prices from last weekly data update — not real-time.
      To get latest prices, update data.csv via Add/Update Row on the Technical Analysis page.</div>`;
  } else {
    html+=`<div class="price-note">⚠️ No price data — load data.csv via Technical Analysis to see current prices and P/L.</div>`;
  }

  html+=`<div style="overflow-x:auto"><table class="tbl">
    <tr>
      <th>#</th><th>Symbol</th><th>Units</th>
      <th>Last Price</th><th>Avg Cost</th>
      <th>Invested</th><th>Worth</th><th>P / L</th>
      <th>P/L %</th><th>DPS</th><th>Yield on Cost</th>
    </tr>`;

  let ti=0,tw=0;
  sorted.forEach((h,i)=>{
    const price  = h.price||null;
    const worth  = price!==null?h.qty*price:null;
    const inv    = h.qty*h.avg;
    const pl     = worth!==null?worth-inv:null;
    const plpct  = pl!==null&&inv>0?(pl/inv)*100:null;
    const yoc    = h.avg>0?(h.dps/h.avg)*100:0;
    ti+=inv;
    if(worth!==null) tw+=worth;

    const priceCell = price!==null
      ? `<td class="c-blue">${fmtD(price)}</td>`
      : `<td class="c-gray">—</td>`;
    const worthCell = worth!==null
      ? `<td>${fmtN(worth)}</td>`
      : `<td class="c-gray">—</td>`;
    const plCell = pl!==null
      ? `<td class="${pl>=0?'c-green':'c-red'}">${pl>=0?'+':''}${fmtN(pl)}</td>`
      : `<td class="c-gray">—</td>`;
    const plpctCell = plpct!==null
      ? `<td class="${plpct>=0?'c-green':'c-red'}">${plpct>=0?'+':''}${plpct.toFixed(1)}%</td>`
      : `<td class="c-gray">—</td>`;

    html+=`<tr>
      <td class="c-gray">${i+1}</td>
      <td class="sym">${h.symbol}</td>
      <td>${h.qty.toLocaleString()}</td>
      ${priceCell}
      <td>${fmtD(h.avg)}</td>
      <td>${fmtN(inv)}</td>
      ${worthCell}
      ${plCell}
      ${plpctCell}
      <td class="c-gold">${h.dps||'—'}</td>
      <td class="${yoc>=8?'c-green':yoc>=5?'c-gold':'c-gray'}">${yoc.toFixed(1)}%</td>
    </tr>`;
  });

  const totalPL=tw>0?tw-ti:null;
  html+=`<tr class="total-row">
    <td colspan="5">TOTAL</td>
    <td>${fmtN(ti)}</td>
    <td>${tw>0?fmtN(tw):'—'}</td>
    <td class="${totalPL!==null&&totalPL>=0?'c-green':'c-red'}">${totalPL!==null?(totalPL>=0?'+':'')+fmtN(totalPL):'—'}</td>
    <td colspan="3"></td>
  </tr></table></div>`;

  document.getElementById('tab-portfolio').innerHTML=html;
}

// ── DIVIDEND INCOME ───────────────────────────
function buildDividend(){
  const withDps=[..._holdings].filter(h=>h.dps>0).sort((a,b)=>b.qty*b.dps-a.qty*a.dps);
  let total=0;

  let html=`<div style="overflow-x:auto"><table class="tbl">
    <tr>
      <th>#</th><th>Symbol</th><th>Sector</th><th>Units</th>
      <th>Annual DPS</th><th>Annual Income</th><th>Yield on Cost</th>
    </tr>`;
  withDps.forEach((h,i)=>{
    const ann=h.qty*h.dps; total+=ann;
    const yoc=h.avg>0?(h.dps/h.avg)*100:0;
    const ycls=yoc>=8?'c-green':yoc>=5?'c-gold':'c-gray';
    html+=`<tr>
      <td class="c-gray">${i+1}</td>
      <td class="sym">${h.symbol}</td>
      <td style="color:#a0c4e8">${h.sector}</td>
      <td>${h.qty.toLocaleString()}</td>
      <td class="c-gold bold">${h.dps}</td>
      <td class="c-green bold">${fmtN(ann)}</td>
      <td class="${ycls} bold">${yoc.toFixed(1)}%</td>
    </tr>`;
  });
  html+=`<tr class="total-row">
    <td colspan="5">TOTAL ANNUAL DIVIDEND</td>
    <td class="c-green bold">${fmtN(total)}</td>
    <td></td>
  </tr></table></div>

  <div class="div-total" style="margin-top:14px">
    <div>
      <div class="dt-lbl">Total Annual Dividend Income</div>
      <div style="font-size:11px;color:#7a9ab5;margin-top:2px">All confirmed DPS included</div>
    </div>
    <div class="dt-val">PKR ${fmtN(total)}</div>
  </div>

  <div class="div-prog">
    <div class="dp-row">
      <span class="c-green">Earned: PKR ${fmtN(total)}</span>
      <span class="c-gold">Gap: PKR ${fmtN(Math.max(0,1000000-total))}</span>
      <span style="color:#ff9800">Target: PKR 1,000,000</span>
    </div>
    <div class="pb"><div class="pf" style="width:${Math.min(total/10000,100)}%">
      <span class="pp">${(total/10000).toFixed(1)}%</span>
    </div></div>
  </div>`;

  document.getElementById('tab-dividend').innerHTML=html;
}

// ── SECTOR BALANCE ────────────────────────────
function buildSector(){
  const map={};
  const totalInv=_holdings.reduce((s,h)=>s+h.qty*h.avg,0);
  _holdings.filter(h=>!EXCLUDE_SEC.includes(h.symbol)).forEach(h=>{
    map[h.sector]=(map[h.sector]||0)+h.qty*h.avg;
  });
  const sectors=Object.entries(map)
    .map(([sec,inv])=>({sec,inv,pct:totalInv>0?(inv/totalInv)*100:0}))
    .sort((a,b)=>b.pct-a.pct);

  let html='<div class="sec-wrap">';
  sectors.forEach(({sec,inv,pct})=>{
    const over=pct>22,under=pct<18;
    const cls=over?'sf-over':under?'sf-under':'sf-ok';
    const flag=over?'🔴 Over':under?'🟡 Under':'✅ OK';
    const fc=over?'#ef5350':under?'#ffc107':'#4caf50';
    html+=`<div class="sec-row">
      <div class="sec-lbl">${sec}</div>
      <div class="sec-bar">
        <div class="sec-fill ${cls}" style="width:${Math.min(pct*4,100)}%">${pct.toFixed(1)}%</div>
        <div class="sec-tgt" style="left:${Math.min(80,100)}%"></div>
      </div>
      <div class="sec-flag" style="color:${fc}">${flag}</div>
      <div class="sec-amt">PKR ${fmtN(inv)}</div>
    </div>`;
  });
  html+=`<div style="font-size:12px;color:#7a9ab5;margin-top:12px;padding:10px 14px;
    background:#1a2535;border-radius:6px;border-left:3px solid #ffc107">
    🎯 Target 20% per sector &nbsp;·&nbsp; 🔴 Over >22% &nbsp;·&nbsp; 🟡 Under <18%
    &nbsp;·&nbsp; ENGROH &amp; FCL excluded
  </div></div>`;

  document.getElementById('tab-sector').innerHTML=html;
}

// ── AUTO LOAD ─────────────────────────────────
async function autoLoad(){
  await loadDataCSV();
  try{
    const res=await fetch('holdings.csv?'+Date.now());
    if(!res.ok) return;
    parseHoldings((await res.text()).replace(/^\uFEFF/,''));
  }catch(e){ console.log('holdings.csv:',e.message); }
}

autoLoad();
</script>
