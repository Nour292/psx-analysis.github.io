<html lang="en">

  if(!u){sessionStorage.setItem('psx_auth_redirect','index.html');window.location.replace('portfolio.html');return;}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSX Technical Analysis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root{
  --bg:        #0A0F1E;
  --surface:   #111827;
  --surface2:  #1C2536;
  --border:    #263348;
  --border2:   #334466;
  --text:      #F0F4FF;
  --text2:     #A8BBDA;
  --text3:     #607090;
  --accent:    #38BDF8;
  --accent-dim:#0C3A52;
  --emerald:   #10B981;
  --emerald-dim:#062B1C;
  --rose:      #F43F5E;
  --rose-dim:  #2B0A14;
  --amber:     #F59E0B;
  --amber-dim: #2B1F04;
  --orange:    #FB923C;
  --orange-dim:#2B1304;
  --slate:     #64748B;
  --radius:    8px;
  --radius-sm: 5px;
  --font:      'Inter', sans-serif;
  --mono:      'DM Mono', monospace;
  --sidebar-w: 220px;
  --sidebar-w-collapsed: 52px;
  --header-h:  52px;
}

/* ── LIGHT MODE ── */
:root.light{
  --bg:        #EFF3F9;
  --surface:   #FFFFFF;
  --surface2:  #E8EDF5;
  --border:    #C8D4E8;
  --border2:   #A8BCE0;
  --text:      #0D1526;
  --text2:     #2D4268;
  --text3:     #6B82A8;
  --accent:    #0369A1;
  --accent-dim:#DBEAFE;
  --emerald:   #047857;
  --emerald-dim:#D1FAE5;
  --rose:      #BE123C;
  --rose-dim:  #FFE4E6;
  --amber:     #B45309;
  --amber-dim: #FEF3C7;
  --orange:    #C2410C;
  --orange-dim:#FFEDD5;
  --slate:     #475569;
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

/* ═══════════════════════════════════════════
   LAYOUT SHELL
═══════════════════════════════════════════ */
.shell{ display:flex; min-height:100vh; }

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh;
  z-index:100; flex-shrink:0; transition:width .22s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed{ width:var(--sidebar-w-collapsed); }
.sidebar-logo{
  padding:0 14px; height:52px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; overflow:hidden; white-space:nowrap;
}
.sidebar-logo .logo-text-wrap{ opacity:1; transition:opacity .15s .05s; flex:1; min-width:0; }
.sidebar.collapsed .logo-text-wrap{ opacity:0; pointer-events:none; }
.logo-icon{ width:28px; height:28px; background:var(--accent); border-radius:6px;
  display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.logo-text{ font-size:14px; font-weight:700; color:var(--text); letter-spacing:.3px; }
.logo-sub{ font-size:10px; color:var(--text3); margin-top:1px; }

/* Floating toggle tab — always visible */
.sb-toggle-tab{
  position:fixed; top:50%;
  left:calc(var(--sidebar-w) - 1px);
  transform:translateY(-50%);
  z-index:200;
  width:18px; height:48px;
  background:var(--surface);
  border:1px solid var(--border); border-left:none;
  border-radius:0 8px 8px 0;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--text3);
  transition:left .22s cubic-bezier(.4,0,.2,1), background .12s, color .12s;
  box-shadow:2px 0 6px rgba(0,0,0,.15);
}
.sb-toggle-tab:hover{ background:var(--surface2); color:var(--text); }
.sb-toggle-tab svg{ transition:transform .22s; flex-shrink:0; }
:root.sb-collapsed .sb-toggle-tab{ left:calc(var(--sidebar-w-collapsed) - 1px); }
:root.sb-collapsed .sb-toggle-tab svg{ transform:rotate(180deg); }

.sidebar-nav{ flex:1; padding:8px 0; display:flex; flex-direction:column; gap:2px; overflow-y:auto; overflow-x:hidden; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:500; color:var(--text2); cursor:pointer;
  border:none; background:transparent; width:100%; text-align:left;
  transition:background .12s, color .12s; white-space:nowrap;
}
.nav-item:hover{ background:var(--surface2); color:var(--text); }
.nav-item.active{ background:var(--accent-dim); color:var(--accent); }
.nav-icon{ font-size:18px; flex-shrink:0; width:22px; text-align:center; line-height:1; }
.nav-label{ transition:opacity .18s, max-width .22s; overflow:hidden; max-width:180px; }
.sidebar.collapsed .nav-label{ opacity:0; max-width:0; pointer-events:none; }
.sidebar.collapsed .nav-item{ padding:9px 0; justify-content:center; gap:0; }
.nav-divider{ height:1px; background:var(--border); margin:6px 8px; }
.sidebar.collapsed .nav-divider{ margin:6px 4px; }

/* ── Accordion nav ── */
.nav-grp{ display:flex; flex-direction:column; }
.nav-grp-btn{
  display:flex; align-items:center; gap:10px; padding:9px 14px;
  border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  color:var(--text2); cursor:pointer; border:none; background:transparent;
  width:100%; text-align:left; white-space:nowrap;
  transition:background .12s,color .12s;
}
.nav-grp-btn:hover{ background:var(--surface2); color:var(--text); }
.nav-grp-btn.open{ color:var(--accent); background:var(--accent-dim); }
.nav-grp-chevron{
  margin-left:auto; font-size:9px; opacity:.5; flex-shrink:0; line-height:1;
  transition:transform .2s cubic-bezier(.4,0,.2,1), opacity .2s;
}
.nav-grp-btn.open .nav-grp-chevron{ transform:rotate(180deg); opacity:1; }
.sidebar.collapsed .nav-grp-btn{ padding:9px 0; justify-content:center; gap:0; }
.sidebar.collapsed .nav-grp-btn .nav-label{ opacity:0; max-width:0; pointer-events:none; }
.sidebar.collapsed .nav-grp-chevron{ display:none; }
/* Sub-list */
.nav-sub{
  display:flex; flex-direction:column;
  overflow:hidden; max-height:0;
  transition:max-height .22s cubic-bezier(.4,0,.2,1);
}
.nav-sub.open{ max-height:220px; }
.sidebar.collapsed .nav-sub{ display:none; }
.nav-sub-btn{
  display:flex; align-items:center; gap:8px;
  padding:7px 12px 7px 42px;
  font-size:12.5px; font-weight:500; color:var(--text3);
  cursor:pointer; border:none; background:transparent;
  width:100%; text-align:left; border-radius:var(--radius-sm);
  white-space:nowrap; transition:background .12s,color .12s;
}
.nav-sub-btn:hover{ background:var(--surface2); color:var(--text); }
.nav-sub-btn.active{ color:var(--accent); background:var(--accent-dim); }

/* Tooltip on collapsed icons */
.sidebar.collapsed .nav-item{ position:relative; }
.sidebar.collapsed .nav-item:hover::after{
  content:attr(data-tip); position:absolute;
  left:calc(var(--sidebar-w-collapsed) + 8px); top:50%; transform:translateY(-50%);
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  font-size:12px; font-weight:600; padding:5px 12px; border-radius:6px;
  white-space:nowrap; z-index:300; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.sidebar-footer{ padding:8px 0; border-top:1px solid var(--border); }
.footer-btn{
  display:flex; align-items:center; gap:9px; padding:9px 14px; border-radius:var(--radius-sm);
  font-size:12px; font-weight:500; color:var(--text2); cursor:pointer;
  border:none; background:transparent; width:100%; text-align:left; white-space:nowrap;
}
.footer-btn:hover{ background:var(--surface2); color:var(--text); }
.footer-label{ transition:opacity .18s, max-width .22s; overflow:hidden; max-width:180px; }
.sidebar.collapsed .footer-label{ opacity:0; max-width:0; pointer-events:none; }
.sidebar.collapsed .sb-foot-info{ display:none; }
.sidebar.collapsed .footer-btn{ padding:9px 0; justify-content:center; gap:0; }

/* MAIN CONTENT */
.main{
  margin-left:var(--sidebar-w); flex:1; min-height:100vh; min-width:0;
  display:flex; flex-direction:column;
  transition:margin-left .22s cubic-bezier(.4,0,.2,1);
}
:root.sb-collapsed .main{ margin-left:var(--sidebar-w-collapsed); }
:root.light .sidebar{ box-shadow:2px 0 12px rgba(0,0,0,.06); }
.topbar{
  height:var(--header-h); background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 24px; gap:12px; flex-shrink:0; position:sticky; top:0; z-index:50;
}
.topbar-title{ font-size:14px; font-weight:600; color:var(--text); flex:1; }
.topbar-date{ font-size:12px; color:var(--text3); font-family:var(--mono); }
.topbar-badge{
  display:none; font-size:11px; color:var(--accent); background:var(--accent-dim);
  padding:3px 10px; border-radius:20px; font-family:var(--mono);
}
.content{ padding:24px; flex:1; }

/* ═══════════════════════════════════════════
   PAGE SYSTEM
═══════════════════════════════════════════ */
.page{ display:none; }
.page.active{ display:block; }

/* ═══════════════════════════════════════════
   HOME PAGE — signal cards + tables
═══════════════════════════════════════════ */
.page-header{ margin-bottom:20px; }
.page-header h1{ font-size:22px; font-weight:700; color:var(--text); margin-bottom:4px; }
.page-header p{ font-size:13px; color:var(--text2); }

.signal-strip{ display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap; }
.sig-card{
  flex:1; min-width:100px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 16px;
}
.sig-card .sv{ font-size:18px; font-weight:700; font-family:var(--mono); color:var(--text); margin-bottom:2px; }
.sig-card .sl{ font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; }
.sig-card.buy .sv{ color:var(--emerald); }
.sig-card.watch .sv{ color:var(--amber); }
.sig-card.caution .sv{ color:var(--orange); }
.sig-card.exit .sv{ color:var(--rose); }
.sig-card.wait .sv{ color:var(--slate); }

.section-label{
  font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px;
  color:var(--text3); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
}
.section-label span{ height:6px; width:6px; border-radius:50%; display:inline-block; }
.section-label.sl-buy span{ background:var(--emerald); }
.section-label.sl-exit span{ background:var(--rose); }

/* ═══════════════════════════════════════════
   DATA TABLES
═══════════════════════════════════════════ */
.tbl-wrap{ overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); margin-bottom:24px; }
.dtbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
.dtbl th{
  background:var(--surface); color:var(--text3); padding:9px 12px; text-align:left;
  font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.7px;
  border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0;
}
.dtbl td{ border-bottom:1px solid var(--border); padding:9px 12px; color:var(--text2); }
.wtbl{ font-size:14px; }
.wtbl td.zone-cell, .wtbl td{ font-size:14px; }
.wtbl .gl{ border-left:1px solid var(--text3); }
.wtbl tr:not(.advrow)>*:nth-child(n+3){ text-align:center; }
.wtbl tr:not(.advrow)>*:nth-child(7){ text-align:right; }
.wtbl .sz{ display:flex; flex-direction:column; align-items:center; white-space:nowrap; padding:0 7px; }
.wtbl .sz:first-child{ padding-left:0; }
.wtbl .sz2{ border-left:1px solid var(--text3); }
.wtbl .sz b{ color:var(--text3); font-size:10px; }
.wtbl th, .wtbl td{ padding:10px 6px; }
.wtbl tr.hasadv>td{ border-bottom:none; }
.wtbl tr.advrow>td{ text-align:justify; padding:8px 6px 10px 6px; font-size:13.5px; line-height:1.55; color:#F5F3FF; background:#2B1D4F; }
:root.light .wtbl tr.advrow>td{ background:#ede9fe; color:#2e1065; }
/* advice text: different notes in different colours */
.wtbl tr.advrow b{ font-weight:800; color:#fff; }
.wtbl .ad-buy{ color:#4ADE80; font-weight:800; }
.wtbl .ad-wait{ color:#FCD34D; font-weight:800; }
.wtbl .ad-sell{ color:#38BDF8; font-weight:800; }
.wtbl .ad-star{ color:#FBBF24; font-weight:700; }
.wtbl .ad-brk{ color:#FDA4AF; font-weight:600; }
.wtbl .ad-hold{ color:#7DD3FC; }
.wtbl .ad-exit{ color:#FB923C; font-weight:700; }
.wtbl .ad-news{ color:var(--text2); font-style:italic; }
.wtbl .ad-room{ background:rgba(245,158,11,.25); color:#FCD34D; padding:1px 6px; border-radius:4px; font-weight:700; }
.wtbl .ad-ex{ background:rgba(251,146,60,.28); color:#FDBA74; padding:1px 6px; border-radius:4px; font-weight:700; }
:root.light .wtbl tr.advrow b{ color:#1e1b4b; }
:root.light .wtbl .ad-buy{ color:#047857; }
:root.light .wtbl .ad-wait{ color:#B45309; }
:root.light .wtbl .ad-sell{ color:#0369A1; }
:root.light .wtbl .ad-star{ color:#B45309; }
:root.light .wtbl .ad-brk{ color:#BE123C; }
:root.light .wtbl .ad-hold{ color:#075985; }
:root.light .wtbl .ad-exit{ color:#C2410C; }
:root.light .wtbl .ad-news{ color:var(--text2); }
:root.light .wtbl .ad-room{ background:#FEF3C7; color:#92400E; }
:root.light .wtbl .ad-ex{ background:#FFEDD5; color:#9A3412; }
.wtbl .listed{ display:inline-block; padding:2px 9px 2px 6px; border-radius:6px; background:#0B3B2C; color:#6EE7B7; font-weight:800; }
.wtbl .listed .flag{ color:#FBBF24; margin-right:5px; }
:root.light .wtbl .listed{ background:#d1fae5; color:#065f46; }
.tbl-wrap.nobar{ overflow:visible; }
.wtbl tr:first-child{ animation:none; }
.wtbl th{ position:sticky; top:var(--header-h); z-index:20; }
.wtbl th{ font-size:12.5px; font-weight:800; letter-spacing:.2px; white-space:normal; line-height:1.3; color:#7DD3FC; background:#12365A; }
:root.light .wtbl th{ background:#dbeafe; color:#1e3a8a; }
@media (max-width:760px){
  .sidebar{ z-index:8000; }
  .sb-toggle-tab{ z-index:8001; }
  .main, :root.sb-collapsed .main{ margin-left:var(--sidebar-w-collapsed) !important; }
}
/* phone: every stock becomes a small card instead of a wide table */
@media (max-width:760px){
  .wtbl, .wtbl tbody{ display:block; }
  .wtbl tr:not(.advrow):has(th){ display:none; }
  #filterBar, #filterBar .filter-group{ flex-wrap:wrap !important; }
  .wtbl tr:not(.advrow){ display:grid; grid-template-columns:1fr 1fr; column-gap:10px; row-gap:6px; align-items:center; padding:10px 12px; margin-top:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px 10px 0 0; }
  .wtbl tr.hasadv{ border-radius:10px 10px 0 0; }
  .wtbl tr:not(.hasadv):not(.advrow){ border-radius:10px; }
  .wtbl tr:not(.advrow)>td{ display:block; border:none !important; padding:0 !important; text-align:left !important; background:none !important; }
  .wtbl tr:not(.advrow)>td::before{ content:attr(data-l); display:block; font-size:11px; font-weight:700; color:var(--text3); }
  .wtbl tr:not(.advrow)>td:nth-child(1){ grid-column:1; grid-row:1; }
  .wtbl tr:not(.advrow)>td:nth-child(8){ grid-column:2; grid-row:1; text-align:right !important; }
  .wtbl tr:not(.advrow)>td:nth-child(2){ grid-column:1; grid-row:2; }
  .wtbl tr:not(.advrow)>td:nth-child(7){ grid-column:2; grid-row:2; }
  .wtbl tr:not(.advrow)>td:nth-child(3){ grid-column:1; grid-row:3; }
  .wtbl tr:not(.advrow)>td:nth-child(4){ grid-column:2; grid-row:3; }
  .wtbl tr:not(.advrow)>td:nth-child(5){ grid-column:1; grid-row:4; }
  .wtbl tr:not(.advrow)>td:nth-child(6){ grid-column:2; grid-row:4; }
  .wtbl .gl{ border-left:none; }
  .wtbl tr.advrow{ display:block; margin:0 0 0 0; border:1px solid var(--border); border-top:none; border-radius:0 0 10px 10px; overflow:hidden; }
  .wtbl tr.advrow>td{ display:block; padding:8px 12px 10px 12px; }
  .wtbl tr.advrow>td:first-child, .wtbl tr.advrow>td:last-child{ display:none; }
}
.dtbl tbody tr:last-child td{ border-bottom:none; }
.dtbl tbody tr:hover td{ background:var(--surface2); }

/* Verdict accent bars */
.dtbl tbody tr.buy-row td:first-child{ border-left:2px solid var(--emerald); }
.dtbl tbody tr.exit-row td:first-child{ border-left:2px solid var(--rose); }
.dtbl tbody tr.watch-row td:first-child{ border-left:2px solid var(--amber); }
.dtbl tbody tr.caution-row td:first-child{ border-left:2px solid var(--orange); }

.sym-cell{ font-weight:700; color:var(--text); font-size:13px; }
.price-cell{ font-family:var(--mono); color:var(--text); font-weight:500; }
.zone-cell{ font-family:var(--mono); font-size:11.5px; color:var(--text3); white-space:nowrap; }
.score-cell{ font-family:var(--mono); font-weight:700; color:var(--text); }
.trend-cell{ text-align:center; font-size:14px; }

.badge-buy     { color:var(--emerald); font-weight:700; font-size:12px; }
.badge-exit    { color:var(--rose); font-weight:700; font-size:12px; }
.badge-watch   { color:var(--amber); font-weight:600; font-size:12px; }
.badge-caution { color:var(--orange); font-weight:700; font-size:12px; }
.badge-wait    { color:var(--slate); font-size:12px; }
.badge-avoid   { color:var(--rose-dim); font-size:12px; }
.qual-a{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:4px;font-size:12px;font-weight:800;font-family:var(--mono);background:var(--emerald-dim);color:var(--emerald);border:1px solid var(--emerald);cursor:default;}
.qual-b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:4px;font-size:12px;font-weight:800;font-family:var(--mono);background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);cursor:default;}
.qual-c{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:4px;font-size:12px;font-weight:800;font-family:var(--mono);background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);cursor:default;}
.qual-d{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:4px;font-size:12px;font-weight:800;font-family:var(--mono);background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);cursor:default;}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.filter-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.filter-label{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--accent);letter-spacing:.08em;margin-right:4px;white-space:nowrap;padding:3px 8px;background:var(--accent-dim);border:1px solid var(--border2);border-radius:4px;}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.fpill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .15s;white-space:nowrap;}
.fpill:hover{border-color:var(--accent);color:var(--accent);}
.fpill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.fpill.fv-buy.active{background:var(--emerald);border-color:var(--emerald);}
.fpill.fv-watch.active{background:var(--amber);border-color:var(--amber);}
.fpill.fv-caution.active{background:#FB923C;border-color:#FB923C;}
.fpill.fv-exit.active{background:var(--rose);border-color:var(--rose);}
.fpill.fv-wait.active{background:var(--slate);border-color:var(--slate);}
.filter-count{font-size:11px;color:var(--text3);margin-left:auto;font-family:var(--mono);white-space:nowrap;}
.filter-row-break{width:100%;height:0;border-top:1px solid var(--border);margin:2px 0;}
.price-input{width:80px;padding:3px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:11px;font-family:var(--mono);outline:none;text-align:center;}
.price-input:focus{border-color:var(--accent);}
.price-go{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);}
.price-go:hover{background:var(--accent);color:#fff;}

/* ═══════════════════════════════════════════
   ANALYSIS PAGE
═══════════════════════════════════════════ */
.analysis-header{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.sig-pill{
  background:var(--surface2); border:1px solid var(--border); border-radius:20px;
  padding:4px 14px; font-size:12px; display:flex; align-items:center; gap:6px;
}
.sig-pill .s-label{ color:var(--text3); font-size:11px; }
.sig-pill .s-val{ font-weight:700; font-family:var(--mono); }

.plans-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:24px; }
.plans-col-label{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
  margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border);
}
.plans-col-label.buy-lbl{ color:var(--emerald); border-color:var(--emerald); }
.plans-col-label.exit-lbl{ color:var(--rose); border-color:var(--rose); }

.plan-card{
  background:var(--surface); border-radius:var(--radius); padding:14px 16px;
  margin-bottom:10px; border:1px solid var(--border);
}
.plan-card.buy{ border-left:3px solid var(--emerald); }
.plan-card.exit{ border-left:3px solid var(--rose); }
.plan-card.caution{ border-left:3px solid var(--orange); }
.plan-card h4{ font-size:13px; font-weight:700; margin-bottom:8px; line-height:1.4; color:var(--text); }
.plan-card code{
  display:block; background:var(--bg); padding:8px 12px; border-radius:var(--radius-sm);
  font-size:12px; color:var(--accent); margin-bottom:6px; font-family:var(--mono); line-height:1.6;
}
.plan-card p{ font-size:12px; color:var(--text2); line-height:1.5; }

/* ═══════════════════════════════════════════
   IMPORT PAGE
═══════════════════════════════════════════ */
.import-actions{
  display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px;
}
.date-input{
  background:var(--surface2); color:var(--accent); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:7px 12px; font-size:13px; outline:none;
  font-family:var(--mono); cursor:pointer;
}
.date-input:focus{ border-color:var(--accent); }
.save-status{ font-size:12px; font-weight:600; font-family:var(--mono); }

.archive-bar{
  display:none; align-items:center; gap:10px; margin-bottom:14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 16px; flex-wrap:wrap;
}
.archive-bar.show{ display:flex; }
.arch-label{ font-size:12px; color:var(--text3); font-weight:600; white-space:nowrap; }
.arch-select{
  flex:1; min-width:180px; background:var(--bg); color:var(--accent);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:7px 12px; font-size:12px; outline:none; font-family:var(--mono);
}

.import-tbl-wrap{ overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }

.imp-th{
  background:var(--surface); color:var(--text3); font-size:10px; font-weight:700;
  padding:9px 6px; text-align:center; border:1px solid var(--border);
  text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
}
.imp-th.ticker-h{ text-align:left; padding-left:12px; min-width:70px; }
.imp-th.group-d{ background:var(--surface2); color:var(--accent); font-size:11px; }
.imp-th.group-w{ background:var(--bg); color:var(--text3); }
.imp-sym{ font-weight:700; color:var(--accent); font-size:13px; padding:8px 12px; border:1px solid var(--border); background:var(--surface); white-space:nowrap; }
.imp-td{ border:1px solid var(--border); padding:3px; }
.imp-in{
  width:100%; background:transparent; color:var(--amber); border:none;
  padding:7px 4px; font-size:12px; font-family:var(--mono); font-weight:500;
  text-align:center; outline:none; min-width:58px;
  transition:background .1s;
}
.imp-in:focus{ background:var(--surface2); color:var(--accent); }
.imp-in::placeholder{ color:var(--text3); font-size:11px; font-weight:400; }

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn{ 
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 16px; border:none; border-radius:var(--radius-sm);
  font-size:12.5px; font-weight:600; cursor:pointer; transition:opacity .15s, background .15s;
  font-family:var(--font); white-space:nowrap;
}
.btn:hover{ opacity:.85; }
.btn-primary{ background:var(--accent); color:#000; }
.btn-success{ background:var(--emerald); color:#000; }
.btn-danger { background:var(--rose); color:#fff; }
.btn-ghost  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover{ color:var(--text); opacity:1; background:var(--border); }
.btn-warn   { background:var(--amber-dim); color:var(--amber); border:1px solid #4A380A; }
.btn-port   { background:#1A1030; color:#A78BFA; border:1px solid #3B2A70; }
.btn-ta     { background:var(--accent-dim); color:var(--accent); border:1px solid var(--border2); }


/* ═══════════════════════════════════════════
   STAGGER ANIMATION — the signature element
═══════════════════════════════════════════ */
@keyframes rowReveal{
  from{ opacity:0; transform:translateX(-6px); }
  to  { opacity:1; transform:translateX(0); }
}
.dtbl tbody tr{
  animation:rowReveal .25s ease both;
}
/* JS sets --delay per row */

/* ── Theme transition ── */
*, *::before, *::after{
  transition: background-color .2s ease, border-color .2s ease, color .15s ease;
}
/* Don't animate layout properties */
.page, .nav-item, .btn, input, select, textarea{
  transition: background-color .2s ease, border-color .2s ease, color .15s ease, opacity .15s;

<script>
/* ════════════════════════════════════════════
   TOPBAR DATE
════════════════════════════════════════════ */
(function(){
  const d=new Date();
  document.getElementById('topbarDate').textContent=
    d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
})();

function hardRefresh(){
  // Clear all cached data then force reload bypassing browser cache
  try{ localStorage.removeItem('psx_dataAsOf'); }catch(e){}
  window.location.reload(true);
}


function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const collapsed=sb.classList.toggle('collapsed');
  document.documentElement.classList.toggle('sb-collapsed',collapsed);
  localStorage.setItem('psx_sb_collapsed',collapsed?'1':'0');
}
function sbStartsCollapsed(){const v=localStorage.getItem('psx_sb_collapsed');return v==='1'||(v===null&&window.innerWidth<=760);}
document.addEventListener('DOMContentLoaded',function(){
  if(sbStartsCollapsed()){
    const sb=document.getElementById('sidebar');
    if(sb)sb.classList.add('collapsed');
    document.documentElement.classList.add('sb-collapsed');
  }
});

/* ════════════════════════════════════════════
   THEME TOGGLE
════════════════════════════════════════════ */
(function(){
  const saved = localStorage.getItem('psx_theme');
  if(saved === 'light') applyLight();
  // apply sidebar state immediately to prevent layout flash
  if(sbStartsCollapsed()) document.documentElement.classList.add('sb-collapsed');
})();

function applyLight(){
  document.documentElement.classList.add('light');
  const icon = document.getElementById('themeIcon');
  const lbl  = document.getElementById('themeLbl');
  if(icon) icon.textContent = '🌙';
  if(lbl)  lbl.textContent  = 'Dark Mode';
}
function applyDark(){
  document.documentElement.classList.remove('light');
  const icon = document.getElementById('themeIcon');
  const lbl  = document.getElementById('themeLbl');
  if(icon) icon.textContent = '☀️';
  if(lbl)  lbl.textContent  = 'Light Mode';
}
function toggleTheme(){
  const isLight = document.documentElement.classList.contains('light');
  if(isLight){ applyDark(); localStorage.setItem('psx_theme','dark'); }
  else        { applyLight(); localStorage.setItem('psx_theme','light'); }
}

/* ════════════════════════════════════════════
   NAV
════════════════════════════════════════════ */
function setNav(id,title){
  document.querySelectorAll('.nav-sub-btn,#navTickBtn').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
  document.getElementById('topbarTitle').textContent=title;
}
/* ── Accordion toggle ── */
/* phone: the sidebar starts as a thin strip; tapping a group opens it over the page, picking an item or tapping the page closes it */
function phoneSb(collapse){const sb=document.getElementById('sidebar');if(!sb)return;sb.classList.toggle('collapsed',collapse);document.documentElement.classList.toggle('sb-collapsed',collapse);}
document.addEventListener('click',function(e){
  if(window.innerWidth>760)return;
  const sb=document.getElementById('sidebar');if(!sb||sb.classList.contains('collapsed'))return;
  if(e.target.closest('.sb-toggle-tab'))return;
  if(e.target.closest('#sidebar')&&!e.target.closest('.nav-sub-btn,.nav-item'))return;
  phoneSb(true);
});
function toggleGrp(grp){
  if(window.innerWidth<=760&&document.getElementById('sidebar').classList.contains('collapsed')){phoneSb(false);document.getElementById(grp==='port'?'navPortSub':'navTASub').classList.add('open');document.getElementById(grp==='port'?'navPortBtn':'navTABtn').classList.add('open');return;}
  if(grp==='ta'){
    const btn=document.getElementById('navTABtn');
    const sub=document.getElementById('navTASub');
    const open=sub.classList.contains('open');
    if(open){
      // 2nd click — collapse only, keep current page
      sub.classList.remove('open'); btn.classList.remove('open');
    } else {
      // 1st click — expand and show Dashboard
      sub.classList.add('open'); btn.classList.add('open');
      goHome();
    }
  } else {
    const btn=document.getElementById('navPortBtn');
    const sub=document.getElementById('navPortSub');
    const open=sub.classList.contains('open');
    if(open){
      sub.classList.remove('open'); btn.classList.remove('open');
    } else {
      sub.classList.add('open'); btn.classList.add('open');
      window.location.href='portfolio.html';
    }
  }
}
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goHome()    { goAnalysis(); }
function goAnalysis(){ showPage('pgAnalysis'); setNav('navAnalysis','Entry & Exit Zones'); runWeekly(); }
function goImport()  { showImportPage();       setNav('navImport','Add / Update Data'); setTimeout(loadArchiveList,500); }

function getLastFriday(){
  const d=new Date();

  const diff=(d.getDay()+2)%7;

}

   CHAT-SYSTEM RULES — stop, targets, R:R, reversal plan (used by the Weekly Analysis table)
════════════════════════════════════════════ */

function tpZones(sym){
  if(_tpZ[sym]!==undefined)return _tpZ[sym];

    const w=i>=n-250?2:1;

      hi.push([h[i][1],w,i]);

      const lvl=h[i][1];let brk=-1;for(let j=i+1;j<n;j++){if(h[j][3]>lvl*1.03){brk=j;break;}}
      if(brk>0){let held=0;for(let j=brk;j<Math.min(n,brk+10);j++)if(h[j][3]>lvl)held++;if(held>=5||brk>=n-5)pk.push([lvl,w,i,'H']);}
    }
  }

  const clus=(pts,minW,mode)=>{
    pts=pts.slice().sort((a,b)=>a[0]-b[0]);const out=[];let c=null;
    pts.forEach(x=>{if(c&&x[0]<=c.lo*1.04){c.hi=x[0];c.w+=x[1];c.n++;c.nL+=(x[3]==='L'?1:0);c.last=Math.max(c.last,x[2]);}else{if(c)out.push(c);c={lo:x[0],hi:x[0],w:x[1],n:1,nL:(x[3]==='L'?1:0),last:x[2]};}});

// a single low (no zone yet) is shown as the band of daily lows around it over the last 12 months
function tpBand(sym,v,cap){
  const h=_tpHist[sym];if(!h||h.length<30)return {lo:v,hi:v};
  const lows=h.slice(-250).map(r=>r[2]).filter(x=>x>=v*0.995&&x<=v*1.03);

// reliability tag of a zone from the daily history: "old" = not tested for 12+ months, "soft" = held fewer than 35% of at least 3 tests,
// "high" / "new" = only one visit (a single peak / a fresh level)
function tpZoneTag(sym,z,type){

  for(let i=0;i<n;i++){const b=h[i];if(b[2]<=z.hi&&b[1]>=z.lo){if(i-last>5)visits.push(i);last=i;}}

  if(visits[visits.length-1]<n-250)return 'old';

  visits.forEach(i=>{if(i>n-12)return;tested++;for(let j=i+1;j<=Math.min(n-1,i+10);j++){if(type==='S'&&h[j][3]>=z.hi*1.03){held++;break;}if(type==='R'&&h[j][3]<=z.lo*0.97){held++;break;}}});

  bar.innerHTML=(!_rawData||!_rawData.length)?'<span style="font-size:12px;color:var(--accent)">Sheet data not loaded yet, so adding is switched off. Press Refresh once the dashboard has data.</span>':toAdd.length?`<button class="btn btn-primary" id="tkAddBtn" onclick="addTickersToSheet()">＋ Add ${toAdd.length} ticker${toAdd.length>1?'s':''} to sheet: ${tkEsc(toAdd.join(', '))}</button>`:'<span style="font-size:12px;color:var(--text3)">Every ticker on the list is already in the sheet.</span>';
  const badge=s=>{const m={New:'#10B981',Active:'#38BDF8',Override:'#F59E0B',Review:'#A78BFA',Dropped:'#F43F5E'};return `<span style="color:${m[s]||'#94A3B8'};font-weight:600;font-size:12px">${tkEsc(s)}</span>`;};
  const bn=v=>Math.abs(v)>=1e7?(v/1e6).toFixed(1)+'B':Math.round(v/1e3)+'M';
  tbl.innerHTML='<tr><th>Symbol</th><th>Status</th><th>Price</th><th>Yield %</th><th>Profit (3 yrs, newest first)</th><th>Div yrs</th><th>In sheet</th><th>News</th><th>Note</th></tr>'+
    d.rows.map(r=>`<tr><td class="sym-cell">${tkEsc(r.symbol)}</td><td>${badge(r.status)}</td><td class="price-cell">${r.price==null?'—':fmt(r.price)}</td><td>${r.yield==null?'—':r.yield.toFixed(1)}</td><td style="font-size:11px;font-family:var(--mono)">${(r.profit||[]).length?(r.profit||[]).map(bn).join(' › '):'—'}</td><td>${r.divYears==null?'—':r.divYears}</td><td>${sh.has(r.symbol)?'✓':'—'}</td><td style="font-size:11px">${tkNewsCell(r.symbol)}</td><td style="font-size:11px;color:var(--text3)">${tkEsc(r.reason||'')}</td></tr>`).join('');
  renderTkNews();
  const passSet=new Set(pass.map(r=>r.symbol)),notOn=[...sh].filter(s=>!passSet.has(s)).sort();
  extra.innerHTML=notOn.length?`<b>In the sheet but not on the list (${notOn.length})</b> — kept as they are, nothing is deleted:<br><span style="font-family:var(--mono);font-size:11px">${notOn.map(tkEsc).join(', ')}</span>`:'';
}
function tkNewsRow(sym){ return _tkNews?(_tkNews.rows||[]).find(x=>x.symbol===sym):null; }
function tkQChip(q){
  if(!q||q.change==null) return '';
  const c=q.change,col=c<=-5?'#F43F5E':c>=5?'#10B981':'#94A3B8';
  return `<span style="color:${col};font-family:var(--mono)">${tkEsc(q.label)} ${c>0?'+':''}${Math.round(c)}%</span>`;
}
function tkNewsCell(sym){
  const n=tkNewsRow(sym); if(!n) return '—';
  const f=n.flagged?`<span style="color:var(--accent)">⚑ ${n.flagged}</span>`:'';
  return [f,tkQChip(n.quarter)].filter(Boolean).join(' · ')||'—';
}
function renderTkNews(){
  const box=document.getElementById('tkNews'); if(!box) return;
  if(!_tkNews){ box.innerHTML='<div style="font-size:12px;color:var(--text3)">No news saved yet. Press <b>News now</b>.</div>'; return; }
  const onList=new Set((_tkData?_tkData.rows:[]).map(r=>r.symbol));
  const rows=(_tkNews.rows||[]).filter(r=>onList.has(r.symbol)&&r.items.length);
  const chip=f=>`<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:var(--accent-dim);color:var(--accent);margin-right:4px">${tkEsc(f)}</span>`;
  box.innerHTML=`<div class="section-label"><span></span> News — last ${_tkNews.days} days <span style="font-weight:400;color:var(--text3);margin-left:8px;font-size:11px">updated ${tkEsc(new Date(_tkNews.updated).toLocaleString('en-GB'))} · ⚑ = flagged item</span></div>`+
    rows.map(r=>`<details style="margin:6px 0;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)"${r.flagged?' open':''}><summary style="cursor:pointer;font-size:13px"><b>${tkEsc(r.symbol)}</b> <span style="color:var(--text3);font-size:11px">${r.flagged} flagged</span> ${tkQChip(r.quarter)}</summary>`+
      r.items.map(i=>`<div style="font-size:12px;padding:3px 0;color:${i.flags.length?'var(--text)':'var(--text3)'}"><span style="font-family:var(--mono);color:var(--text3)">${tkEsc(i.date)}</span> ${i.flags.map(chip).join('')}${tkEsc(i.title)}${i.doc?` <a href="https://dps.psx.com.pk/download/document/${tkEsc(i.doc)}.pdf" target="_blank" style="color:var(--accent)">PDF</a>`:''}</div>`).join('')+'</details>').join('');
}
async function runNewsNow(){
  if(!tkIsAdmin()) return;
  if(!_idxToken){ alert('Paste your GitHub token in the sidebar first (it needs the "workflow" permission).'); return; }
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/pull-news.yml/dispatches`,{method:'POST',headers:{'Authorization':'Bearer '+_idxToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({ref:'main'})});
    alert(res.status===204?'News run started. Press Refresh in about a minute.':'Could not start the news run (HTTP '+res.status+'). The token needs the "workflow" permission.');
  }catch(e){ alert('Could not start the news run: '+e.message); }
}
async function addTickersToSheet(){
  if(!tkIsAdmin()) return;
  const list=tkToAdd(); if(!list.length) return;
  if(!confirm('Add '+list.length+' ticker(s) to the Data sheet, column A?\n\n'+list.join(', ')+'\n\nOnly the symbol is added. Nothing else in the sheet changes.')) return;
  const btn=document.getElementById('tkAddBtn'); if(btn){ btn.disabled=true; btn.textContent='Adding…'; }
  let ok=0,fail=[];
  for(const sym of list){
    try{
      const res=await fetch(GS_WRITE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'append',tab:'Data',row:[sym]})});
      const j=await res.json(); if(j.ok){ ok++; _tkAdded.add(sym); } else fail.push(sym);
    }catch(e){ fail.push(sym); }
  }
  renderTickers();
  alert(ok+' added'+(fail.length?'\nFailed: '+fail.join(', '):'')+'\n\nIndicators fill in at the next daily update.');
}
async function runTickersNow(){
  if(!tkIsAdmin()) return;
  if(!_idxToken){ alert('Paste your GitHub token in the sidebar first (it needs the "workflow" permission).'); return; }
  const btn=document.getElementById('tkRunBtn'); btn.disabled=true; btn.textContent='Starting…';
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${TK_WF}/dispatches`,{method:'POST',headers:{'Authorization':'Bearer '+_idxToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({ref:'main'})});
    if(res.status!==204){ alert('Could not start the run (HTTP '+res.status+'). The token needs the "workflow" permission.'); btn.disabled=false; btn.textContent='▶ Run now'; return; }
  }catch(e){ alert('Could not start the run: '+e.message); btn.disabled=false; btn.textContent='▶ Run now'; return; }
  btn.textContent='Running…';
  const t0=Date.now(); clearInterval(_tkPoll);
  _tkPoll=setInterval(async()=>{
    const run=await loadTkRunStatus();
    if((run&&run.status==='completed'&&new Date(run.created_at).getTime()>t0-60000)||Date.now()-t0>300000){
      clearInterval(_tkPoll); btn.disabled=false; btn.textContent='▶ Run now'; loadTickers();
    }
  },10000);
}

loadSavedToken();
updateArchiveStatus();
loadCSV();
loadTopTickers();
/* Deep-link from portfolio sub-items */
(function(){
  const h=window.location.hash;
  if(h==='#weekly') setTimeout(goAnalysis,120);
  if(h==='#tickers') setTimeout(goTickers,120);
})();
</script>
